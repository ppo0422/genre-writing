/* ---------------- feedback corner ---------------- */
const CRIT = ["구조","장르 표현","정확성","내용과 어휘"];
const RATE = ["","노력","보통","잘함"];
let fbTab = "auto", peerDel = -1;
function FB(g){ S.fb ||= {}; const f = (S.fb[g.id] ||= {}); f.peers ||= []; f.teacher ||= {scores:[0,0,0,0],stamp:"",comment:""}; f.goal ||= ""; return f; }
function starsEl(n){ return h("span",{class:"stars","aria-label":`별 ${n}개`}, "★".repeat(n), h("span",{class:"off"},"★".repeat(3-n))); }
function words(text){ return (text.toLowerCase().match(/[a-z']+/g)||[]); }
function findAll(text, list){ const t=" "+text.toLowerCase().replace(/[^a-z' ]+/g," ").replace(/\s+/g," ")+" "; return list.filter(w=>t.includes(" "+w+" ")); }
function sentCount(t, st){
  if(!t) return 0;
  if(st.numbered) return t.split("\n").filter(l=>l.trim()).length;
  return t.split(/(?<=[.!?])\s+|\n+/).filter(s=>/[a-z]/i.test(s)).length;
}
let _sets=null;
function sets(){
  if(_sets) return _sets;
  const one = e=>!e.wl.includes(" ");
  _sets = {
    verbs:new Set(DICT.filter(e=>e.p==="v"&&one(e)).map(e=>e.wl)),
    past:new Set(DICT.flatMap(e=>e.pastL).filter(w=>!w.includes(" "))),
    adj:new Set(DICT.filter(e=>e.p==="a"&&one(e)).map(e=>e.wl))
  };
  return _sets;
}
const TIME_W = ["first","then","next","after that","finally","later","after lunch","in the morning","in the afternoon","in the evening","at night","yesterday","last weekend","last","at last"];
const STORY_W = ["once upon a time","long ago","one day","suddenly","then","luckily","in the end","finally","from that day","at last"];
const ADV_CONN = ["however","although","even though","though","while","because","since","so","therefore","as a result","in addition","moreover","besides","meanwhile","later","after that","finally","when","before","after","once","until","unless","if","instead","on the other hand","for example","for instance","in the end","by the time","just then","looking back","at first","eventually"];
const FEEL_W = ["fun","happy","excited","exciting","great","tired","proud","sad","interesting","scared","amazing","glad","delicious","wonderful","felt","feel","surprised","worried","angry","lonely","thankful","upset","nervous","sorry"];

function analyze(g){
  const parts = g.stages.map(st=>({st, t:T(g.id,st.id).trim()}));
  const all = parts.map(p=>p.t).join("\n");
  const noQuote = all.replace(/"[^"]*"|“[^”]*”/g," ");
  const W = words(all), {verbs,past,adj} = sets();
  const lv = S.level, out = [];

  /* 1. 구조 */
  const sChecks = parts.map(({st,t})=>{
    const n = sentCount(t,st), need = Math.max(1,(st.min||1)-(lv===1&&st.min?1:0));
    const ok = !!t && (st.title || n>=need);
    return {ok, html: !t ? `<b>${st.ko}</b> 부분이 비어 있어요.` : ok ? `<b>${st.ko}</b>(${st.en}) 부분이 있어요.${st.min?` (문장 ${n}개)`:""}` : `<b>${st.ko}</b> 부분이 짧아요. 문장 ${n}개 / 목표 ${need}개`, st, need};
  });
  const sBad = sChecks.filter(c=>!c.ok);
  out.push({name:CRIT[0], score: sBad.length===0?3: sBad.length===1?2:1, checks:sChecks,
    praise:`글의 단계(${g.stages.map(s=>s.en).join(" → ")})를 빠짐없이 갖췄어요.`,
    tip: sBad.length ? (T(g.id,sBad[0].st.id).trim() ? `'${sBad[0].st.ko}' 부분을 ${sBad[0].need}문장 이상으로 늘려 보세요.` : `'${sBad[0].st.ko}' 부분을 채워 보세요. ${sBad[0].st.q}`) : ""});

  /* 2. 장르 표현 */
  const L = [];
  const pastCheck = ()=>{
    const bad = tenseIssues(noQuote, PRESENT_TO_PAST);
    const pc = W.filter(w=>past.has(w)||/[a-z]{2,}ed$/.test(w)).length;
    L.push({ok: pc>=2 && bad.length <= (lv===3?1:0), html: bad.length ? `과거형으로 바꿀 동사가 있어요: ${bad.map(([a,b])=>`<code>${a}</code> → <code>${b}</code>`).join(", ")}` : `과거형 동사를 ${pc}번 썼어요.`, tip:"지난 일이니 동사를 모두 과거형으로 바꿔 보세요. 단어 사전에서 과거형을 찾을 수 있어요."});
  };
  const feelCheck = ()=>{
    const f = findAll(all, FEEL_W);
    L.push({ok:f.length>=1, html: f.length ? `느낌 표현: ${f.map(x=>`<code>${x}</code>`).join(", ")}` : "느낌이나 감정을 나타내는 말이 없어요.", tip:"It was fun. / I felt proud.처럼 느낌을 한 문장 넣어 보세요."});
  };
  if(g.id==="recount"){
    pastCheck();
    const tw = findAll(all, TIME_W), need = lv===1?1:2;
    L.push({ok:tw.length>=need, html: tw.length ? `시간 순서 말: ${tw.map(x=>`<code>${x}</code>`).join(", ")}` : "시간 순서 말이 없어요.", tip:"First, Then, After that, Finally로 일어난 순서를 분명하게 보여 주세요."});
    feelCheck();
  } else if(g.id==="procedure"){
    const goal = T(g.id,"goal").trim(), mat = T(g.id,"materials").trim();
    L.push({ok:/^how to\b/i.test(goal), html: /^how to\b/i.test(goal) ? `제목이 <code>How to …</code>로 시작해요.` : "제목이 How to …로 시작하지 않아요.", tip:"제목을 How to Make …로 바꿔 보세요."});
    const q = /\b(a|an|one|two|three|four|five|six|some|half|\d+)\b/i.test(mat);
    L.push({ok:q, html: q ? "준비물에 개수나 양을 썼어요." : "준비물의 개수나 양이 보이지 않아요.", tip:"two slices of bread, a cup of milk처럼 양을 함께 써 주세요."});
    const lines = T(g.id,"steps").split("\n").map(l=>l.replace(/^\s*\d+[.)]\s*/,"").replace(/^(first|then|next|after that|finally|second|third|now),?\s*/i,"").trim()).filter(Boolean);
    const imp = lines.filter(l=>verbs.has((l.split(/\s+/)[0]||"").toLowerCase().replace(/[^a-z]/g,""))).length;
    L.push({ok: lines.length>=3 && imp>=Math.ceil(lines.length*0.8), html: lines.length ? `방법 ${lines.length}줄 중 ${imp}줄이 동사로 시작해요.` : "방법이 아직 없어요.", tip:"방법은 Put, Cut, Mix처럼 동사로 시작해요. 주어(I, You)는 빼요."});
  } else if(g.id==="report"){
    const bad = tenseIssues(noQuote, PAST_TO_PRESENT);
    L.push({ok:!bad.length && all.length>0, html: bad.length ? `현재형으로 바꿀 동사가 있어요: ${bad.map(([a,b])=>`<code>${a}</code> → <code>${b}</code>`).join(", ")}` : "사실을 현재형으로 썼어요.", tip:"사실을 알려 주는 글은 현재형(are, have, eat)으로 써요."});
    const sents = all.split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
    const gen = sents.filter(s=>/^(they|[A-Z][a-z]+s)\b/.test(s)).length;
    L.push({ok:gen>=2, html:`They나 복수형 주어로 시작한 문장이 ${gen}개예요.`, tip:"Pandas are… / They have…처럼 대상 전체를 가리키는 주어로 써 보세요."});
    const facts = sentCount(T(g.id,"facts").trim(), {}), need = lv===1?2:3;
    L.push({ok:facts>=need, html:`특징을 알려 주는 문장이 ${facts}개예요.`, tip:"생김새, 먹이, 사는 곳, 할 수 있는 일 중에서 사실을 하나 더 써 보세요."});
  } else if(g.id==="exposition"){
    const th = T(g.id,"thesis"), ar = T(g.id,"arguments"), re = T(g.id,"reiteration");
    const op = /\b(think|should|believe|opinion|must)\b/i.test(th);
    L.push({ok:op, html: op ? "처음에 내 주장을 분명하게 밝혔어요." : "주장 문장(I think…, We should…)이 보이지 않아요.", tip:"I think we should…처럼 첫 문장에 내 주장을 써 보세요."});
    const rs = findAll(ar, ["first","second","third","also","another","in addition","for example","for instance","because","finally","first of all","however"]);
    const need = lv===1 ? 2 : 3;
    L.push({ok:rs.length>=need, html: rs.length ? `이유를 알리는 말: ${rs.map(x=>`<code>${x}</code>`).join(", ")}` : "이유를 알리는 말이 없어요.", tip:"First, Second, For example로 이유를 나누고 예를 들어 보세요."});
    const ri = /\b(so|for these reasons|that's why|therefore|in conclusion|think|should|believe)\b/i.test(re);
    L.push({ok:ri, html: ri ? "마지막에 주장을 다시 말했어요." : "마무리에서 주장을 다시 말하지 않았어요.", tip:"So, I think…로 처음 주장을 한 번 더 말해 보세요."});
    if(lv===3){ const ca = /\b(some people|others? (say|argue|think)|however|on the other hand)\b/i.test(ar);
      L.push({ok:ca, html: ca ? "반대 의견을 다루고 다시 반박했어요." : "반대 의견을 다루지 않았어요.", tip:"Some people argue that… However, …로 반대 의견에 답해 보세요."}); }
  } else {
    pastCheck();
    const sw = findAll(all, STORY_W);
    L.push({ok:sw.length>=2, html: sw.length ? `이야기 시간 말: ${sw.map(x=>`<code>${x}</code>`).join(", ")}` : "이야기 흐름을 알려 주는 말이 없어요.", tip:"Once upon a time, One day, Suddenly, In the end로 이야기 흐름을 보여 주세요."});
    feelCheck();
    const qt = /["“]/.test(all);
    L.push({ok: qt || lv===1, html: qt ? "인물의 말을 따옴표로 썼어요." : "인물의 대화가 없어요.", tip:"\"I can help you!\" said Bear.처럼 인물의 말을 넣어 보세요."});
  }
  if(lv===3){
    const conn = findAll(all, ADV_CONN);
    L.push({ok:conn.length>=4, html: conn.length ? `연결어 ${conn.length}종류: ${conn.slice(0,8).map(x=>`<code>${x}</code>`).join(", ")}` : "연결어가 거의 없어요.", tip:"however, although, as a result, meanwhile처럼 연결어를 4종류 이상 써 보세요."});
    const sents = all.split(/(?<=[.!?]["”]?)\s+|\n+/).filter(x=>/[a-z]/i.test(x));
    const cx = sents.filter(x=>/\b(when|because|although|though|while|if|since|until|once|unless|who|which|where|whose|that)\b/i.test(x)).length;
    L.push({ok:cx>=3, html:`복문(when, because, which…)이 들어간 문장 ${cx}개 / 목표 3개`, tip:"두 문장을 when, because, although, which로 이어 한 문장으로 만들어 보세요."});
  }
  const lOk = L.filter(c=>c.ok).length;
  out.push({name:CRIT[1], score: lOk===L.length?3: lOk>=L.length/2?2:1, checks:L,
    praise:`${g.ko}의 특징을 잘 살려 썼어요.`, tip:(L.find(c=>!c.ok)||{}).tip||""});

  /* 3. 정확성 */
  const warns = g.stages.flatMap(st=>checkStage(g,st,T(g.id,st.id)).filter(x=>x.k==="warn" && !x.m.startsWith("아직 비어")));
  if(!W.length) out.push({name:CRIT[2], score:1, checks:[{ok:false, html:"아직 쓴 글이 없어요."}], praise:"", tip:"쓰기 단계에서 글을 먼저 써요."});
  else out.push({name:CRIT[2], score: warns.length===0?3: warns.length<=2?2:1,
    checks: warns.length ? warns.slice(0,4).map(w=>({ok:false, html:w.m})) : [{ok:true, html:"대문자, 마침표, 시제에서 고칠 곳을 찾지 못했어요."}],
    praise:"대문자, 마침표, 시제를 정확하게 썼어요.", tip:"고쳐쓰기 단계의 자동 점검을 보면서 하나씩 고쳐 보세요."});

  /* 4. 내용과 어휘 */
  const target = {1:15,2:45,3:100}[lv];
  const uniq = new Set(W).size, ratio = W.length? Math.round(uniq/W.length*100) : 0;
  const adjs = [...new Set(W.filter(w=>adj.has(w)))];
  if(lv===1){
    const map = frameMap(g);
    const ss = g.stages.flatMap(st=>splitSents(T(g.id,st.id),st));
    const own = ss.filter(x=>!map[x]).length, fromFrame = ss.length-own;
    const C = [
      {ok:W.length>=target, html:`단어 ${W.length}개 / 목표 ${target}개`},
      {ok:own>=1, html: own ? `내가 바꾸거나 직접 쓴 문장 ${own}개 · 문장 틀 그대로 ${fromFrame}개` : `모든 문장(${fromFrame}개)을 문장 틀에서 그대로 넣었어요.`}
    ];
    const cs = W.length>=target && own>=1 ? 3 : (W.length>=target || own>=1) ? 2 : 1;
    out.push({name:CRIT[3], score:cs, checks:C, praise:"문장 틀을 잘 활용하고, 내 이야기로 바꿔 썼어요.",
      tip: own<1 ? "넣은 문장에서 단어 하나를 내 이야기에 맞게 바꾸거나, 문장 하나를 직접 써 보세요." : `문장을 하나 더 넣어서 ${target}단어를 넘겨 보세요.`});
  } else {
    const needAdj = lv===3 ? 4 : 2;
    const nS = g.stages.reduce((a,st)=>a+sentCount(T(g.id,st.id).trim(),st),0);
    const avg = nS ? Math.round(W.length/nS*10)/10 : 0;
    const C = [
      {ok:W.length>=target, html:`단어 ${W.length}개 / 목표 ${target}개`},
      {ok:adjs.length>=needAdj, html: adjs.length ? `꾸며 주는 말: ${adjs.slice(0,8).map(x=>`<code>${x}</code>`).join(", ")}` : "꾸며 주는 말(형용사)이 없어요."},
      {ok:ratio>=55 || W.length<20, html:`서로 다른 단어 비율 ${ratio}%`},
      lv===2 ? {ok:avg>=7, html:`문장 하나에 평균 ${avg}단어 / 목표 7단어`} : null
    ].filter(Boolean);
    const cs = W.length>=target && adjs.length>=needAdj && (lv!==2 || avg>=7) ? 3 : W.length>=target*0.6 ? 2 : 1;
    out.push({name:CRIT[3], score:cs, checks:C, praise:"내용이 풍부하고 단어를 다양하게 썼어요.",
      tip: lv===2 && avg<7 && nS ? "문장 늘리기로 누구와, 언제, 왜를 붙여 문장을 길게 만들어 보세요." : W.length<target ? `문장을 2~3개 더 써서 ${target}단어를 넘겨 보세요.` : adjs.length<needAdj ? `꾸며 주는 말을 ${needAdj}개 이상 넣어 더 생생하게 써 보세요.` : "같은 단어 반복을 줄이고 단어 사전에서 더 정확한 단어를 찾아 써 보세요."});
  }
  return out;
}

function fixBox(g){
  const all = g.stages.flatMap(st=>{ const t=T(g.id,st.id); return findErrors(g,st,t).map(e=>({...e, st, t})); });
  if(!all.length) return null;
  const hard = all.filter(e=>!e.soft), soft = all.filter(e=>e.soft);
  return h("div",{class:"fix-box"+(hard.length?"":" soft-only")},
    h("div",{class:"fix-h"}, hard.length ? h("b",{},`꼭 고칠 곳 ${hard.length}개`) : null, soft.length ? h("b",{class:"soft"},`확인할 곳 ${soft.length}개`) : null),
    h("ul",{class:"fix-list"}, [...hard,...soft].slice(0,12).map(e=>h("li",{class:e.soft?"soft":""},
      h("span",{class:"fx-word",lang:"en"}, e.miss ? "( . )" : e.t.slice(e.s,e.e)),
      h("span",{class:"fx-msg"}, e.msg),
      h("span",{class:"fx-where"}, e.st.ko)))),
    h("button",{class:"btn small primary",type:"button",style:"justify-self:start",onclick:()=>go(2)},"고치러 가기"));
}
function fbTextPanel(g){
  const parts = composed(g);
  return h("section",{class:"panel fb-text",id:"fbText"},
    h("h3",{style:"font-size:19px;margin-bottom:4px"}, `${S.name||"이름 없음"}의 ${g.ko}`),
    parts.length ? parts.map(({st,t})=>h("div",{class:"part"}, h("span",{class:"plabel"},`${st.en} · ${st.ko}`), h("div",{class:"ptext",lang:"en"},markText(t, findErrors(g,st,t)))))
                 : h("p",{class:"muted"},"아직 쓴 글이 없어요. 쓰기 단계에서 글을 먼저 써요."));
}

function fbAuto(g){
  const A = analyze(g);
  const best = A.filter(c=>c.score===3), low = [...A].sort((a,b)=>a.score-b.score)[0];
  const sec = h("div",{style:"display:grid;gap:14px"},
    fixBox(g),
    h("div",{class:"crit-row"}, A.map(c=>h("div",{class:"crit s"+c.score}, h("span",{class:"nm"},c.name), starsEl(c.score), h("span",{class:"lb"},RATE[c.score])))),
    h("div",{class:"fb-box good"}, h("b",{},"잘한 점"), best.length ? best.map(c=>h("div",{},c.praise)) : h("div",{},`${A.slice().sort((a,b)=>b.score-a.score)[0].name}에서 가장 좋은 점수를 받았어요. 조금만 더 다듬으면 돼요!`)),
    low.score<3 ? h("div",{class:"fb-box next"}, h("b",{},`다음 도전 · ${low.name}`), h("div",{},low.tip)) : h("div",{class:"fb-box good"}, h("b",{},"다음 도전"), h("div",{},"모든 기준을 잘 해냈어요! 다음에는 한 단계 위에서 써 보세요.")),
    A.map(c=>h("div",{class:"crit-card"+(c.score<3?" low":"")}, h("h4",{},c.name," ",starsEl(c.score)),
      h("ul",{class:"chk"}, [...c.checks].sort((x,y)=>(x.ok?1:0)-(y.ok?1:0)).map(k=>h("li",{class:k.ok?"":"no",html:k.html}))))),
    h("div",{id:"aiFbSlot"}, aiState==="on" ? aiFeedback(g) : null));
  return sec;
}

function fbPeer(g){
  const F = FB(g);
  const field = (id,label,ph)=>{
    const ta = h("textarea",{id,rows:"3",placeholder:ph});
    return {ta, el:h("div",{class:"field"}, h("label",{for:id},label), ta)};
  };
  const who = h("input",{id:"peerName",placeholder:"친구 이름",autocomplete:"off"});
  const s1 = field("peerStar1","★ 칭찬 하나","어느 문장이 가장 좋았나요? 왜 좋았나요?");
  const s2 = field("peerStar2","★ 칭찬 둘","또 잘한 점은 무엇인가요?");
  const w = field("peerWish","♥ 바라는 점","어느 부분을 어떻게 바꾸면 더 좋아질까요?");
  const submit = h("button",{class:"btn primary",type:"button"},"피드백 남기기");
  submit.addEventListener("click",()=>{
    const v = {name:who.value.trim(), star1:s1.ta.value.trim(), star2:s2.ta.value.trim(), wish:w.ta.value.trim(), at:Date.now()};
    const short = [[s1,v.star1],[s2,v.star2],[w,v.wish]].find(([f,t])=>t.replace(/\s/g,"").length<8);
    if(short){ toast(short[1] ? "조금 더 자세히 써 주세요." : "칭찬 두 가지와 바라는 점을 모두 써 주세요."); try{ short[0].ta.focus(); }catch(e){} return; }
    F.peers.push(v); save(); fbTab="peer"; drawFb(g); toast(`${v.name||"친구"}의 피드백을 남겼어요. 기기를 글쓴이에게 돌려주세요.`);
  });
  const list = F.peers.length ? F.peers.map((p,i)=>h("div",{class:"peer"},
      h("div",{class:"who"}, h("span",{}, `${p.name||"친구"} · ${new Date(p.at).toLocaleDateString("ko-KR",{month:"long",day:"numeric"})}`),
        peerDel===i ? h("span",{style:"display:flex;gap:6px"}, h("button",{class:"btn small",type:"button",onclick:()=>{F.peers.splice(i,1);peerDel=-1;save();drawFb(g);}},"지우기"), h("button",{class:"btn small",type:"button",onclick:()=>{peerDel=-1;drawFb(g);}},"취소"))
                    : h("button",{class:"btn small",type:"button",onclick:()=>{peerDel=i;drawFb(g);}},"지우기")),
      p.star1? h("div",{},"★ ",p.star1):null, p.star2? h("div",{},"★ ",p.star2):null, p.wish? h("div",{style:"color:var(--g-recount)"},"♥ ",p.wish):null))
    : [h("p",{class:"note",style:"margin:0"},"아직 받은 친구 피드백이 없어요.")];
  return h("div",{style:"display:grid;gap:14px"},
    h("div",{class:"field"}, h("label",{for:"peerName"},"피드백 해 주는 친구"), who), s1.el, s2.el, w.el, submit,
    h("h3",{style:"font-size:18px;margin-top:6px"},`받은 친구 피드백 ${F.peers.length}개`), ...list);
}

function drawFb(g){
  const box = $("#fbPane"); if(!box) return;
  const F = FB(g);
  document.querySelectorAll(".fb-tabs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tab===fbTab)));
  $("#fbPeerN").textContent = F.peers.length;
  box.replaceChildren(fbTab==="peer" ? fbPeer(g) : fbAuto(g));
}

function renderFeedback(g){
  const F = FB(g);
  const tabs = h("div",{class:"fb-tabs",role:"group","aria-label":"피드백 종류"},
    [["auto","자동 피드백"],["peer","친구 피드백"]].map(([k,l])=>
      h("button",{type:"button","data-tab":k,onclick:()=>{fbTab=k;peerDel=-1;drawFb(g);}}, l, k==="peer"?[" ",h("span",{id:"fbPeerN"},String(F.peers.length))]:null)));
  const goal = h("textarea",{id:"fbGoal",rows:"2",placeholder:"예: 다음에는 느낌을 더 자세히 쓸 거예요."}); goal.value = F.goal;
  goal.addEventListener("input",()=>{ F.goal=goal.value; save(); });
  const wrap = h("div",{},
    h("div",{class:"fb-wrap"}, fbTextPanel(g),
      h("section",{class:"panel",style:"display:grid;gap:14px"}, tabs, h("div",{id:"fbPane"}))),
    h("section",{class:"panel",style:"margin-top:18px;display:grid;gap:8px"},
      h("label",{for:"fbGoal",style:"font-family:var(--f-display);font-size:18px"},"나의 다음 도전"), goal),
    h("div",{class:"nav"},
      h("button",{class:"btn",type:"button",onclick:()=>go(2)},"← 다시 고쳐 쓰기"),
      h("button",{class:"btn primary",type:"button",onclick:()=>go(4)},"완성하기 →")));
  setTimeout(()=>drawFb(g));
  return wrap;
}

/* Korean: 먹었다 → 먹다, 갔어요 → 가다, 행복했다 → 행복 */
function hj(ch){ if(!ch) return null; const c=ch.charCodeAt(0)-0xAC00; if(c<0||c>11171) return null; return {cho:Math.floor(c/588), jung:Math.floor((c%588)/28), jong:c%28}; }
function hs(cho,jung,jong){ return String.fromCharCode(0xAC00+cho*588+jung*28+jong); }
const KO_IRR = {"도왔다":"돕다","추웠다":"춥다","더웠다":"덥다","어려웠다":"어렵다","쉬웠다":"쉽다","귀여웠다":"귀엽다","무거웠다":"무겁다","가벼웠다":"가볍다","무서웠다":"무섭다","아름다웠다":"아름답다","즐거웠다":"즐겁다","외로웠다":"외롭다","고마웠다":"고맙다","반가웠다":"반갑다","들었다":"듣다","걸었다":"걷다","몰랐다":"모르다","불렀다":"부르다","골랐다":"고르다","빨랐다":"빠르다","달랐다":"다르다","슬펐다":"슬프다","아팠다":"아프다","배고팠다":"배고프다","예뻤다":"예쁘다","바빴다":"바쁘다","기뻤다":"기쁘다","컸다":"크다","썼다":"쓰다","껐다":"끄다","지었다":"짓다","나았다":"낫다","했다":"하다"};
function koCands(q0){
  let q=q0.replace(/\s+/g,"");
  const full=new Set(), cores=new Set(); let past=false;
  if(/해요$/.test(q)) q=q.replace(/해요$/,"하다");
  else if(/(어|아)요$/.test(q)) q=q.slice(0,-2)+"다";
  full.add(q);
  if(KO_IRR[q]){ full.add(KO_IRR[q]); past=true; }
  if(q.length>=2 && q.endsWith("다")){
    const pre=q.slice(0,-1), last=pre.slice(-1), head=pre.slice(0,-1);
    if(["었","았","였"].includes(last) && head){ full.add(head+"다"); past=true; }
    const L=hj(last);
    if(L && L.jong===20 && last!=="있"){
      past=true;
      const map={9:[8],14:[13],6:[20],1:[0],10:[11],4:[18]};
      [L.jung,...(map[L.jung]||[])].forEach(v=>full.add(head+hs(L.cho,v,0)+"다"));
    }
  }
  [...full].forEach(f=>cores.add(f.replace(/(하다|다|한|해|하)$/,"")));
  cores.add(q0.replace(/\s+/g,"").replace(/(에서|으로|은|는|이|가|을|를|에|로|와|과|도|의|들)$/,""));
  cores.delete("");
  return {full:[...full], cores:[...cores], past};
}
/* English: went → go, eating → eat, bigger → big */
function enCands(q){
  const m=new Map(); const add=(c,k)=>{ if(c && c!==q && !m.has(c)) m.set(c,k); };
  const IRR={children:"child",people:"person",mice:"mouse",teeth:"tooth",feet:"foot",women:"woman",men:"man",leaves:"leaf",better:"good",best:"good",worse:"bad",worst:"bad"};
  if(IRR[q]) add(IRR[q], /^(better|best|worse|worst)$/.test(q)?"er":"s");
  if(/ies$/.test(q)) add(q.slice(0,-3)+"y","s");
  if(/es$/.test(q)) add(q.slice(0,-2),"s");
  if(/s$/.test(q)) add(q.slice(0,-1),"s");
  if(/ied$/.test(q)) add(q.slice(0,-3)+"y","ed");
  if(/ed$/.test(q)){ add(q.slice(0,-2),"ed"); add(q.slice(0,-1),"ed"); if(/(.)\1ed$/.test(q)) add(q.slice(0,-3),"ed"); }
  if(/ing$/.test(q)){ const b=q.slice(0,-3); add(b,"ing"); add(b+"e","ing"); if(/(.)\1$/.test(b)) add(b.slice(0,-1),"ing"); if(/y$/.test(b)) add(b.slice(0,-1)+"ie","ing"); }
  if(/iest$/.test(q)) add(q.slice(0,-4)+"y","er");
  if(/ier$/.test(q)) add(q.slice(0,-3)+"y","er");
  if(/est$/.test(q)){ add(q.slice(0,-3),"er"); add(q.slice(0,-2),"er"); if(/(.)\1est$/.test(q)) add(q.slice(0,-4),"er"); }
  if(/er$/.test(q)){ add(q.slice(0,-2),"er"); add(q.slice(0,-1),"er"); if(/(.)\1er$/.test(q)) add(q.slice(0,-3),"er"); }
  return m;
}
const KIND_POS = {s:["n","v"], ed:["v"], ing:["v"], er:["a"]};
function searchOne(q){
  const res=new Map();

  if(!/[가-힣ㄱ-ㅎ]/.test(q)){
    const cands=enCands(q);
    for(const e of DICT){
      const wl=e.wl;
      if(wl===q) put(e,100,null);
      else if(e.pastL.includes(q)) put(e,95,"past");
      else if(e.ppL.includes(q)) put(e,93,"pp");
      else if(cands.has(wl) && KIND_POS[cands.get(wl)].includes(e.p)) put(e,85,cands.get(wl));
      else if(q.length>=2 && wl.startsWith(q)) put(e,60-Math.min(20,wl.length-q.length),null);
      else if(q.length>=2 && (" "+wl+" ").includes(" "+q+" ")) put(e,55,null);
      else if(q.length>=3 && wl.includes(q)) put(e,40,null);
      else if(q.length>=3 && e.pastL.some(p=>p.startsWith(q))) put(e,35,"past");
      else if(q.length>=3 && e.insL.some(x=>x.includes(q))) put(e,q.length>=5?88:45,null);
    }
  } else {
    const {full,cores,past}=koCands(q);
    q=q.replace(/\s+/g,"");
    for(const e of DICT){
      let best=0;
      for(const t0 of e.toks){
        const t=t0.replace(/\s+/g,"");
        let sc=0;
        if(t===q) sc=100;
        else if(full.includes(t)) sc=90;
        else if(cores.some(c=>c.length>=2 && t.startsWith(c) && t.length-c.length<=2)) sc=70;
        else if(q.length>=2 && t.includes(q)) sc=50;
        else if(cores.some(c=>c.length>=2 && t.includes(c))) sc=40;
        else if(q.length===1 && t.startsWith(q)) sc=20;
        if(sc>best) best=sc;
      }
      if(best) put(e,best, past && e.past && best>=90 ? "kopast" : null);
    }
  }
  return res;
}
const STOP = new Set(["a","an","the","to","of","is","am","are","my","your","i","we","it"]);

function similar(q){
  q=q.toLowerCase(); const lim=q.length<=4?1:2;
  return DICT.filter(e=>Math.abs(e.wl.length-q.length)<=lim).map(e=>({e,d:lev(q,e.wl)})).filter(x=>x.d<=lim).sort((a,b)=>a.d-b.d).slice(0,5).map(x=>x.e);
}

let canSpeak=false; try{ canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined"; }catch(e){}
function speak(w){ try{ const u=new SpeechSynthesisUtterance(w); u.lang="en-US"; u.rate=0.85; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){ toast("이 기기에서는 소리를 들을 수 없어요."); } }

function aiPrompt(q){
  const g=G(), stage=activeTA?.st;
  const lvl=["","low","middle","high"][S.level];
  const genre = g ? `a ${g.en}${stage?` (the "${stage.en}" part)`:""}` : "a short English text";
  const tenseHint = !g ? "" : g.tense==="past"?"Use the past tense because this text tells about past events.":g.tense==="present"?"Use the simple present tense because this text gives general facts.":(stage?.id==="steps"?"Write it as an instruction that starts with a verb (imperative).":"");
  return `A Korean 6th-grade EFL student (about age 12, writing level: ${LV_DESC[S.level]}) is writing ${genre} in English and wants to say this: "${q}".
Give 3 short, natural English options a child can write, simplest first. ${tenseHint} Use only easy words. If the input is a single word, give the English word first, then two short example sentences using it. If the input is not about something to write, give a kind short hint in Korean instead as the first item's "ko".
Reply with only a JSON array like [{"en":"I rode a roller coaster.","ko":"롤러코스터를 탔다"}]. "ko" is a short Korean meaning or tip.`;
}

let dictOpen=false, dictTab="search", dictQ="", dictTopic=0, dictLv="all", dictEl=null, dictTimer=null;
function addRecent(q){ q=(q||"").trim(); if(!q) return; S.recent=[q,...(S.recent||[]).filter(x=>x!==q)].slice(0,8); save(); }
function toggleSave(key){ const s=new Set(S.saved||[]); s.has(key)?s.delete(key):s.add(key); S.saved=[...s]; save(); }
function dictTarget(){
  const g=G(); if(!g || !(S.step===1||S.step===2)) return null;
  if(liveBlank()) return {blank:true, st:activeBlank.st};
  if(activeTA && document.contains(activeTA.ta)) return activeTA;
  const ta = document.querySelector(".stages .stage:not([hidden]) .paper");
  const st = ta ? g.stages.find(x=>ta.id===`ta-${g.id}-${x.id}`) : null;
  return ta && st ? {ta,st} : null;
}
function dictInsert(text){
  const t=dictTarget(); if(!t) return;
  if(t.blank){ fillBlank(text); addRecent(dictQ); return; }
  insertInto(t.ta, text, {append:false, noFocus:true});
  addRecent(dictQ);
  toast(`'${text}' → '${t.st.ko}' 칸에 넣었어요.`);
}
function setDictQ(v){ dictQ=v; $("#dictInput").value=v; dictTab="search"; drawDict(); }

function dictCard(e, via){
  const q=dictQ.trim();
  const card=h("div",{class:"dentry"},
    h("div",{class:"d-top"}, h("span",{class:"d-word",lang:"en"},e.w), h("span",{class:"pos "+e.p},POS[e.p]||""), e.lv==="중"?h("span",{class:"lv"},"중학"):e.lv==="생활"?h("span",{class:"lv life"},"생활"):null, h("span",{class:"d-cat"},DICT_CATS[e.cat])),
    h("div",{class:"d-ko"},e.ko));
  if(e.past) card.append(h("div",{class:"d-forms"},"과거형 ",h("b",{lang:"en"},e.past), e.ppL.length?[" · 과거분사 ",h("b",{lang:"en"},e.pp)]:null));
  const hint = via==="past" ? `${q}는 ${e.w}의 과거형이에요.`
    : via==="kopast" ? `지난 일은 과거형 ${e.past}(으)로 써요.`
    : via==="pp" ? `${q}는 ${e.w}의 과거분사예요. have ${q}처럼 써요.`
    : via==="ed" ? `${q}는 ${e.w}의 과거형이에요.`
    : via==="ing" ? `${q}는 ${e.w}에 -ing가 붙은 모양이에요.`
    : via==="s" ? `${q}는 ${e.w}에 -s가 붙은 모양이에요.`
    : via==="er" ? `${q}는 ${e.w}의 비교하는 모양(더 ~한, 가장 ~한)이에요.` : null;
  if(hint) card.append(h("div",{class:"d-hint"},hint));
  if(e.tip || e.ins){
    const tipText = e.tip || "영어에 없는 말은 이름을 그대로 쓰고 괄호 안에 설명을 붙여요.";
    card.append(h("div",{class:"d-tip"}, h("b",{},"쓰는 법 "), tipText,
      e.ins ? h("div",{}, "예: ", h("span",{class:"ex",lang:"en"}, e.ins.split(/\s*\/\s*/)[0])) : null));
  }
  const acts=h("div",{class:"d-actions"});
  if(canSpeak) acts.append(h("button",{class:"d-btn",type:"button",onclick:()=>speak(e.w)},"듣기"));
  if(dictTarget()){
    let forms=[e.w, ...(e.past? e.past.split(/\s*\/\s*/):[])];
    if(via==="past"||via==="kopast"||via==="ed") forms=[...forms.slice(1),forms[0]];
    if(via==="pp") forms=[...e.pp.split(/\s*\/\s*/), e.w];
    if(e.ins) forms=[...e.ins.split(/\s*\/\s*/), ...forms];
    [...new Set(forms)].forEach(f=>acts.append(h("button",{class:"d-btn ins",type:"button",onclick:()=>dictInsert(f)},"넣기 · ",h("span",{lang:"en"},f))));
  }
  const on=(S.saved||[]).includes(e.key);
  const sb=h("button",{class:"d-btn",type:"button","aria-pressed":String(on)},on?"단어장에 있어요":"내 단어장에 담기");
  sb.addEventListener("click",()=>{
    toggleSave(e.key); addRecent(dictQ);
    const now=(S.saved||[]).includes(e.key);
    sb.setAttribute("aria-pressed",String(now)); sb.textContent=now?"단어장에 있어요":"내 단어장에 담기";
    $("#dictSavedN").textContent=S.saved.length;
    if(dictTab==="saved" && !now) drawDict();
  });
  acts.append(sb); card.append(acts);
  return card;
}

function dictNoResult(q){
  const box=h("div",{class:"d-none"}, h("p",{},`'${q}'는 사전에 없어요.`));
  if(!/[가-힣ㄱ-ㅎ]/.test(q)){
    const sims=similar(q);
    if(sims.length) box.append(h("p",{class:"note"},"혹시 이 단어를 찾았나요? 철자를 확인해 봐요."),
      h("div",{class:"starters"}, sims.map(e=>h("button",{class:"chip",type:"button",onclick:()=>setDictQ(e.w)},e.w))));
  } else {
    box.append(h("p",{class:"note"},"더 짧게 찾아 보세요. 예: '즐거운 하루' → '즐거운', '놀러 갔다' → '갔다'"));
  }
  if(aiState==="on"){
    const out=h("div",{style:"display:grid;gap:6px"});
    const b=h("button",{class:"btn small primary",type:"button",style:"justify-self:start"},"AI에게 물어보기");
    b.addEventListener("click",async()=>{
      b.disabled=true; out.innerHTML=""; out.append(h("div",{class:"note"},"생각하는 중…"));
      try{
        const arr=await sample.json(aiPrompt(q),{modelTier:"quick"});
        out.innerHTML="";
        (Array.isArray(arr)?arr:[]).slice(0,4).forEach(o=>{ if(!o||!o.en) return;
          const card=h("div",{class:"dentry"}, h("div",{class:"d-top"},h("span",{class:"d-word",lang:"en",style:"font-size:17px"},String(o.en))), h("div",{class:"d-ko"},String(o.ko||"")));
          const acts=h("div",{class:"d-actions"});
          if(canSpeak) acts.append(h("button",{class:"d-btn",type:"button",onclick:()=>speak(String(o.en))},"듣기"));
          if(dictTarget()) acts.append(h("button",{class:"d-btn ins",type:"button",onclick:()=>dictInsert(String(o.en))},"넣기"));
          card.append(acts); out.append(card);
        });
        if(!out.children.length) out.append(h("div",{class:"note"},"알맞은 표현을 찾지 못했어요. 다르게 물어봐요."));
      }catch(e){ out.innerHTML=""; out.append(h("div",{class:"note"},aiErr(e))); }
      finally{ b.disabled=false; }
    });
    box.append(b,out);
  } else {
    box.append(h("p",{class:"note"},"그래도 없으면 선생님께 물어봐요."));
  }
  return box;
}

function drawDict(){
  if(!dictEl) return;
  dictEl.querySelectorAll(".dict-tabs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tab===dictTab)));
  $("#dictSavedN").textContent=(S.saved||[]).length;
  const t=dictTarget();
  $("#dictTarget").innerHTML = t ? `넣을 곳: <b>${t.blank?"빈칸":t.st.ko}</b>` : ""; $("#dictTarget").hidden = !t;
  const body=$("#dictBody"); body.innerHTML=""; body.scrollTop=0;
  if(dictTab==="search"){
    const q=dictQ.trim();
    if(!q){
      if((S.recent||[]).length) body.append(h("div",{class:"d-sec"},"최근에 찾은 말"),
        h("div",{class:"starters"}, S.recent.map(r=>h("button",{class:"chip",type:"button",onclick:()=>setDictQ(r)},r))));
      body.append(h("div",{class:"d-sec"},"예시"),
        h("div",{class:"starters"}, ["떡볶이","높이뛰기","학원","노트북","먹었다","went"].map(x=>h("button",{class:"chip",type:"button",onclick:()=>setDictQ(x)},x))),
        );
      return;
    }
    const r=dictSearch(q);
    if(!r.length){ body.append(dictNoResult(q)); return; }
    body.append(h("div",{class:"d-sum"},`'${q}' 찾은 결과 ${r.length}개`));
    r.forEach(x=>body.append(dictCard(x.e,x.via)));
  } else if(dictTab==="topic"){
    const on="background:var(--accent);border-color:var(--accent);color:var(--accent-ink)";
    body.append(h("div",{class:"cats"}, [["all","전체"],["초","초등"],["중","중학"],["생활","생활"]].map(([v,l])=>
      h("button",{type:"button","aria-pressed":String(dictLv===v),style:dictLv===v?on:null,onclick:()=>{dictLv=v;drawDict();}},l))));
    body.append(h("div",{class:"cats"}, DICT_CATS.map((c,i)=>{
      const b=h("button",{type:"button","aria-pressed":String(i===dictTopic),style:i===dictTopic?"background:var(--accent);border-color:var(--accent);color:var(--accent-ink)":null,onclick:()=>{dictTopic=i;drawDict();}},c);
      return b; })));
    const kong = DICT_CATS[dictTopic]==="콩글리시 주의";
    const list=DICT.filter(e=>(e.cat===dictTopic || (kong && e.tip.includes("콩글리시"))) && (dictLv==="all"||e.lv===dictLv));
    body.append(h("div",{class:"d-sum"},`${DICT_CATS[dictTopic]} ${list.length}개`));
    if(!list.length) body.append(h("div",{class:"d-none"},h("p",{},"이 주제에는 해당하는 단어가 없어요.")));
    list.forEach(e=>body.append(dictCard(e,null)));
  } else {
    const list=(S.saved||[]).map(k=>DICT.find(e=>e.key===k)).filter(Boolean);
    if(!list.length){ body.append(h("div",{class:"d-none"},h("p",{},"아직 담은 단어가 없어요."),null)); return; }
    body.append(h("div",{class:"d-sum"},`내가 담은 단어 ${list.length}개`));
    list.forEach(e=>body.append(dictCard(e,null)));
  }
}

function buildDict(){
  const input=h("input",{class:"dict-input",id:"dictInput",type:"search",placeholder:"한국어나 영어로 찾기",autocomplete:"off",enterkeyhint:"search","aria-label":"찾을 단어"});
  input.addEventListener("input",()=>{ dictQ=input.value; if(dictTab!=="search") dictTab="search"; clearTimeout(dictTimer); dictTimer=setTimeout(drawDict,120); });
  input.addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); addRecent(input.value); } });
  dictEl=h("aside",{class:"dict",id:"dict","aria-label":"단어 사전",hidden:true},
    h("div",{class:"dict-h"}, h("h2",{},"단어 사전"), h("span",{class:"n"},`초등~중3 + 생활 · ${DICT.length}개`),
      h("button",{class:"dict-close",type:"button",onclick:closeDict},"닫기")),
    h("div",{class:"dict-target",id:"dictTarget"}),
    input,
    h("div",{class:"dict-tabs",role:"group","aria-label":"사전 보기"},
      h("button",{type:"button","data-tab":"search",onclick:()=>{dictTab="search";drawDict();}},"찾기"),
      h("button",{type:"button","data-tab":"topic",onclick:()=>{dictTab="topic";drawDict();}},"주제별"),
      h("button",{type:"button","data-tab":"saved",onclick:()=>{dictTab="saved";drawDict();}},"내 단어장 ",h("span",{id:"dictSavedN"},"0"))),
    h("div",{class:"dict-body",id:"dictBody"}));
  document.body.append(dictEl);
}
function openDict(q){
  if(!dictEl) buildDict();
  if(typeof q==="string" && q.trim()){ dictQ=q.trim(); dictTab="search"; }
  $("#dictInput").value=dictQ;
  dictOpen=true; dictEl.hidden=false; document.body.classList.add("dict-on");
  $("#dictBtn").setAttribute("aria-expanded","true");
  drawDict();
  setTimeout(()=>{ try{ $("#dictInput").focus({preventScroll:true}); }catch(e){} },0);
}
function closeDict(){
  if(!dictEl) return;
  dictOpen=false; dictEl.hidden=true; document.body.classList.remove("dict-on");
  $("#dictBtn").setAttribute("aria-expanded","false");
  if(dictQ.trim()) addRecent(dictQ);
  try{ $("#dictBtn").focus({preventScroll:true}); }catch(e){}
}

/* ---------------- wiring ---------------- */
$("#dictBtn").addEventListener("click",()=> dictOpen ? closeDict() : openDict());
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && dictOpen) closeDict(); });
document.querySelectorAll(".levels button").forEach(b=>b.addEventListener("click",()=>{ if(lockedLevel) return; S.level=+b.dataset.level; save(); render(); }));
/* 선생님이 나눠 주는 링크: #beginner #intermediate #advanced 는 단계를 고정하고, #together 는 교실 화면용 함께 쓰기 모드예요 */
let lockedLevel = 0, together = false;
function applyHash(){
  const key = (location.hash||"").replace(/^#/,"").toLowerCase();
  lockedLevel = {beginner:1, intermediate:2, advanced:3}[key] || 0;
  together = key==="together";
  document.body.classList.toggle("together", together);
  $("#tgPill").hidden = !together;
  $(".levels").classList.toggle("locked", !!lockedLevel);
  $("#nameInput").readOnly = together;
  if(together && S.name!=="함께 쓰기"){ save(); const P = STORE.profiles["함께 쓰기"]; S = fresh(P || {level:S.level}); S.name = "함께 쓰기"; }
  if(lockedLevel) S.level = lockedLevel;
  save();
}
window.addEventListener("hashchange",()=>{ applyHash(); render(); });
applyHash();
$("#nameInput").addEventListener("change",e=>switchStudent(e.target.value));
$("#nameInput").addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.isComposing) e.target.blur(); });
$("#homeBtn").addEventListener("click",()=>{ S.genre=null; save(); render(); });
render();

(async ()=>{
  try{ sample = window.claude?.use ? await window.claude.use("sample") : null; }catch(e){ sample=null; }
  aiState = sample ? "on" : "off";
  // refresh only the AI boxes so nothing the student is typing is lost
  if(G() && (S.step===1||S.step===2)){
    const g = G();
    const oldAsk = $(".wordpanel .ai");
    if(oldAsk){ oldAsk.replaceWith(aiAsk(g, e=>insertInto(activeTA?.ta||$(".stage:not([hidden]) .paper"), e, {append:false}))); }
    const side = $(".side"); if(side && side.lastElementChild){ side.lastElementChild.replaceWith(aiFeedback(g)); }
  }
  if(G() && S.step===3){ const slot=$("#aiFbSlot"); if(slot && aiState==="on") slot.replaceChildren(aiFeedback(G())); }
  if(dictOpen) drawDict();
})();
</script>
