<title>장르 글쓰기 스튜디오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: a bright classroom sticker-book — chunky rounded cards with a colored "press" shadow, a sunny tip strip, big friendly Korean display type (Jua) and an early-reader English face (Andika) on ruled notebook paper */
:root{
  --bg:#EAF4FF; --surface:#FFFFFF; --sunk:#F2F7FE; --ink:#1F2D45; --muted:#5D6D88; --line:#CFE0F5;
  --accent:#2F7BFF; --accent-ink:#FFFFFF; --accent-deep:#1B58C9; --mark:#FFE15C; --mark-ink:#1F2D45;
  --ok:#17955B; --ok-bg:#DFF6E9; --warn:#CF7A12; --warn-bg:#FFF1D6;
  --sun:#FFC93C; --tip:#FFF7D6; --tip-line:#FFD866; --press:#B9D2F2;
  --g-recount:#FF6B57; --g-procedure:#12AE87; --g-report:#3F7BFF; --g-narrative:#A35CF0; --g-exposition:#E38B00;
  --rule:#C6DAF3; --margin:#FF9FB0; --red:#E0262A;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-en:"Andika","Gowun Dodum",system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A2A; --surface:#1B2538; --sunk:#172133; --ink:#EAF1FC; --muted:#A3B2CB; --line:#2D3B55;
  --accent:#6FA5FF; --accent-ink:#0D1526; --accent-deep:#3F78D6; --mark:#6A5A10; --mark-ink:#FFF4C8;
  --ok:#5ED394; --ok-bg:#163327; --warn:#F5B451; --warn-bg:#352812;
  --sun:#E8B02A; --tip:#2C2814; --tip-line:#7A6420; --press:#0E1626;
  --g-recount:#FF8C7B; --g-procedure:#3ED3AC; --g-report:#7FA6FF; --g-narrative:#C493FF; --g-exposition:#FFB43D;
  --rule:#2A3852; --margin:#7A3A4A; --red:#FF6B6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A2A; --surface:#1B2538; --sunk:#172133; --ink:#EAF1FC; --muted:#A3B2CB; --line:#2D3B55;
  --accent:#6FA5FF; --accent-ink:#0D1526; --accent-deep:#3F78D6; --mark:#6A5A10; --mark-ink:#FFF4C8;
  --ok:#5ED394; --ok-bg:#163327; --warn:#F5B451; --warn-bg:#352812;
  --sun:#E8B02A; --tip:#2C2814; --tip-line:#7A6420; --press:#0E1626;
  --g-recount:#FF8C7B; --g-procedure:#3ED3AC; --g-report:#7FA6FF; --g-narrative:#C493FF; --g-exposition:#FFB43D;
  --rule:#2A3852; --margin:#7A3A4A; --red:#FF6B6B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.25}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.en{font-family:var(--f-en)}
.muted{color:var(--muted)}
mark{background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:3px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;padding:0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:20px}
.brand h1{font-size:24px}
.who{display:flex;align-items:center;gap:8px}
.who label{font-size:14px;color:var(--muted)}
.who input{width:120px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.levels{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.levels button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:14px;line-height:1.3;text-align:left}
.levels button b{font-family:var(--f-en);font-weight:700;font-size:14px;display:block}
.levels button span{font-size:12px;color:var(--muted)}
.levels button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* home */
.intro{display:grid;gap:6px;margin-bottom:20px}
.intro h2{font-size:30px}
.intro p{margin:0;max-width:62ch;color:var(--muted)}
.genres{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:16px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;align-content:start;border-top:6px solid var(--gc)}
.gcard:hover{border-color:var(--gc)}
.gcard .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.gcard h3{font-size:24px;color:var(--gc)}
.gcard .en-name{font-family:var(--f-en);font-weight:700;font-size:14px;color:var(--muted)}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.gcard p{margin:0;font-size:15px}
.stagepath{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--f-en);font-size:13px}
.stagepath span{border:1px solid var(--line);padding:1px 8px;border-radius:999px}
.stagepath i{color:var(--muted);font-style:normal}
.example{font-family:var(--f-en);font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
details.guide{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
details.guide summary{cursor:pointer;font-family:var(--f-display);font-size:18px}
details.guide ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;max-width:70ch}

/* workspace */
.ws-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:14px}
.ws-head h2{font-size:28px;color:var(--gc)}
.ws-head .en-name{font-family:var(--f-en);font-weight:700;color:var(--muted)}
.steps{display:flex;gap:6px;margin-bottom:22px;overflow-x:auto;padding-bottom:2px}
.steps button{flex:1 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:15px;white-space:nowrap}
.steps button .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-family:var(--f-en);font-weight:700;font-size:13px}
.steps button[aria-current="step"]{border-color:var(--gc);box-shadow:inset 0 -3px 0 var(--gc)}
.steps button[aria-current="step"] .n{background:var(--gc);color:var(--surface)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 18px;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}

/* learn */
.learn{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.purpose{font-size:18px;margin:0 0 14px}
.model{display:grid;gap:10px}
.mpart{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border-radius:12px;background:var(--sunk)}
.mpart .lbl{font-family:var(--f-en);font-weight:700;font-size:14px;color:var(--gc);line-height:1.3}
.mpart .lbl small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:13px}
.mpart .txt{font-family:var(--f-en);font-size:17px;line-height:1.7;white-space:pre-line}
.features{display:grid;gap:10px}
.feat{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.feat b{font-family:var(--f-display);font-weight:400;font-size:17px;display:block}
.feat .ex{font-family:var(--f-en);font-size:15px;color:var(--muted)}

/* write */
.write{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.stage{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;display:grid;gap:12px}
.stages{display:grid;gap:16px}
.stage-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage-h .num{font-family:var(--f-en);font-weight:700;color:var(--surface);background:var(--gc);border-radius:8px;padding:0 8px;font-size:14px}
.stage-h h3{font-size:20px}
.stage-h .en-name{font-family:var(--f-en);font-weight:700;font-size:14px;color:var(--muted)}
.stage-q{margin:0;color:var(--muted);font-size:15px}
.frames{display:grid;gap:8px}
.frame{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--f-en);font-size:16px;background:var(--sunk);border-radius:12px;padding:8px 10px}
.frame select{font:inherit;font-family:var(--f-en);border:1px dashed var(--gc);background:var(--surface);color:var(--ink);border-radius:8px;padding:2px 6px;max-width:100%}
.frame .add{margin-left:auto;border:0;background:var(--gc);color:var(--surface);border-radius:8px;padding:3px 10px;font-family:var(--f-body);font-size:13px}
.starters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-family:var(--f-en);font-size:15px}
.chip:hover{border-color:var(--gc)}
.tip{font-size:14px;background:var(--sunk);border-radius:10px;padding:8px 12px}
.tip b{font-weight:400;font-family:var(--f-display)}
.paper{width:100%;min-height:calc(2.2em * 4 + 16px);resize:vertical;border:1px solid var(--line);border-radius:12px;padding:8px 14px 8px 44px;
  font-family:var(--f-en);font-size:19px;line-height:2.2em;color:var(--ink);
  background-color:var(--surface);
  background-image:linear-gradient(90deg,transparent 32px,var(--margin) 32px,var(--margin) 34px,transparent 34px),repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.2em - 1px),var(--rule) calc(2.2em - 1px),var(--rule) 2.2em);
  background-position:0 0,0 8px;background-attachment:local}
.paper.title{min-height:auto;height:calc(2.2em + 18px);resize:none}
.count{font-size:13px;color:var(--muted);text-align:right;margin-top:-6px}

/* word panel */
.wordpanel{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;max-height:calc(100vh - 24px);overflow:auto}
.wp-h{display:flex;justify-content:space-between;align-items:center}
.wp-h h3{font-size:19px}
.wp-close{display:none;border:0;background:var(--sunk);border-radius:8px;padding:4px 10px}
.target{font-size:13px;color:var(--muted)}
.target b{color:var(--gc);font-weight:400;font-family:var(--f-display)}
.wp-search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);font:inherit}
.cats{display:flex;flex-wrap:wrap;gap:4px}
.cats button{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 10px;font-size:13px}
.cats button[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:var(--surface)}
.words{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.word{display:grid;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 9px;line-height:1.25}
.word:hover{border-color:var(--gc)}
.word .w{font-family:var(--f-en);font-weight:700;font-size:15px}
.word .k{font-size:12px;color:var(--muted)}
.ai{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.ai h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:16px}
.ai-row{display:flex;gap:6px}
.ai-row input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);font:inherit}
.ai-out{display:grid;gap:6px}
.ai-out .word{grid-template-columns:1fr}
.note{font-size:13px;color:var(--muted)}
.wp-fab{display:none}

/* revise */
.revise{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.issues{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.issues li{font-size:14px;border-radius:10px;padding:7px 12px;background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn)}
.issues li.ok{background:var(--ok-bg);border-left-color:var(--ok)}
.issues li.tipi{background:var(--sunk);border-left-color:var(--accent)}
.issues code{font-family:var(--f-en);font-weight:700;font-size:15px}
.side{display:grid;gap:16px;position:sticky;top:12px}
.checklist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.checklist label{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.checklist input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.side h3{font-size:19px;margin-bottom:10px}
.fb{display:grid;gap:10px}
.fb .praise{background:var(--ok-bg);border-radius:10px;padding:10px 12px;font-size:15px}
.fix{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.fix .from{font-family:var(--f-en);text-decoration:line-through;color:var(--muted)}
.fix .to{font-family:var(--f-en);font-weight:700}
.fix .why{font-size:13px;color:var(--muted)}
.fix .btn{justify-self:start;margin-top:4px}

/* finish */
.final{max-width:760px;margin:0 auto;display:grid;gap:16px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 28px 28px 56px;position:relative;
  background-image:linear-gradient(90deg,transparent 38px,var(--margin) 38px,var(--margin) 40px,transparent 40px)}
.sheet .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted);margin-bottom:14px}
.sheet h3{font-family:var(--f-en);font-weight:700;font-size:32px;margin-bottom:12px}
.sheet .body{font-family:var(--f-en);font-size:26px;line-height:1.9;display:grid;gap:16px}
.sheet .body p{margin:0}
.sheet .body ol{margin:0;padding-left:1.4em}
.sheet .body .sub{font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px}
.stat b{font-family:var(--f-en);font-size:22px;display:block;font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);border-radius:12px;padding:10px 14px;font-size:15px}

/* level support */
.fr{display:grid;gap:6px;background:var(--sunk);border-radius:12px;padding:8px 10px}
.fr .frame{background:none;padding:0}
.fr-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:15px}
.fr-ko{flex:1;min-width:180px}
.fr-ko b{font-family:var(--f-display);font-weight:400;color:var(--gc)}
.fr .add{margin-left:0;border:0;background:var(--gc);color:var(--surface);border-radius:8px;padding:4px 12px;font-size:14px}
.chip .gl{display:none;font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:6px}
.show-gl .chip .gl{display:inline}
.gl-toggle{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:1px 10px;font-size:12px}
.mean{display:grid;gap:2px}
.mean-h{font-family:var(--f-display);font-size:15px}
.mrow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:14px;border-bottom:1px dashed var(--line);padding-block:5px}
.men{font-family:var(--f-en);font-weight:700;font-size:15px}
.mko{color:var(--muted);font-size:15px;white-space:pre-line}
.mown{font-size:12px;background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:0 8px}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.kw{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;display:grid;gap:2px;text-align:center}
.kw:hover{border-color:var(--gc)}
.kw .w{font-family:var(--f-en);font-weight:700;font-size:18px}
.kw .k{font-size:14px;color:var(--muted)}
.kw .k.hid{font-size:12px;opacity:.75}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:grid;gap:6px;align-content:start}
.mbtn{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-size:16px}
.mbtn.en{font-family:var(--f-en);font-weight:700}
.mbtn[aria-pressed="true"]{border-color:var(--accent)}
.mbtn.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.mbtn.bad{border-color:var(--g-recount);background:var(--warn-bg)}

/* feedback corner */
.fb-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.fb-text{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;display:grid;gap:4px}
.fb-text .part{display:grid;gap:2px;padding-block:8px;border-bottom:1px dashed var(--line)}
.fb-text .part:last-child{border-bottom:0}
.fb-text .plabel{font-size:12px;color:var(--gc);font-family:var(--f-en);font-weight:700;letter-spacing:.02em}
.fb-text .ptext{font-family:var(--f-en);font-size:17px;line-height:1.7;white-space:pre-line;overflow-wrap:anywhere}
.fb-tabs{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px}
.fb-tabs button{flex:1;border:0;background:none;border-radius:9px;padding:7px 8px;font-size:14px}
.fb-tabs button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.crit-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.crit{border:1px solid var(--line);border-radius:12px;padding:10px 6px;display:grid;gap:2px;justify-items:center;text-align:center}
.crit .nm{font-size:13px;color:var(--muted)}
.crit .lb{font-family:var(--f-display);font-size:15px}
.stars{color:var(--warn);font-size:18px;letter-spacing:1px;line-height:1.2;white-space:nowrap}
.stars .off{color:var(--line)}
.fb-box{border-radius:12px;padding:10px 14px;font-size:15px;display:grid;gap:2px}
.fb-box.good{background:var(--ok-bg)}
.fb-box.next{background:var(--warn-bg)}
.fb-box b{font-family:var(--f-display);font-weight:400;font-size:16px}
.crit-card{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.crit-card h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px;display:flex;gap:8px;align-items:baseline}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.chk li{font-size:14px;padding-left:22px;position:relative}
.chk li::before{content:"✓";position:absolute;left:4px;color:var(--ok);font-weight:700}
.chk li.no::before{content:"!";color:var(--warn)}
.chk code{font-family:var(--f-en);font-weight:700;font-size:15px}
.chk b{font-weight:400;font-family:var(--f-display)}
.field{display:grid;gap:6px}
.field label{font-family:var(--f-display);font-size:16px}
.field textarea,.field input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink);width:100%}
.peer{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px;font-size:15px}
.peer .who{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.trow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:center}
.rate{display:flex;gap:4px;flex-wrap:wrap}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 10px;font-size:13px}
.rate button[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn)}
.stamp{display:inline-grid;place-items:center;border:3px solid var(--g-recount);color:var(--g-recount);border-radius:50%;width:112px;height:112px;padding:10px;font-family:var(--f-en);font-weight:700;font-size:18px;line-height:1.1;text-align:center;transform:rotate(-10deg)}
.stamp.sm{width:88px;height:88px;font-size:15px;flex:none}
.t-fb{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);font-family:var(--f-body)}
.t-fb p{margin:0;font-size:15px}
@media (max-width:920px){.fb-wrap{grid-template-columns:1fr}.fb-text{position:static;max-height:none}}
@media (max-width:560px){.crit-row{grid-template-columns:repeat(2,minmax(0,1fr))}.trow{grid-template-columns:1fr}}
@media (min-width:921px){body.dict-on .fb-wrap{grid-template-columns:minmax(0,1fr)}body.dict-on .fb-text{position:static;max-height:none}}

/* dictionary corner */
.dict-open{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:12px;padding:8px 14px;font-family:var(--f-display);font-size:16px;line-height:1.2}
.dict-open[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.dict{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.14);z-index:60;display:flex;flex-direction:column;gap:10px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 18px}
.dict-h{display:flex;align-items:baseline;gap:10px}
.dict-h h2{font-size:24px}
.dict-h .n{font-size:13px;color:var(--muted);margin-right:auto}
.dict-close{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:5px 12px;font-size:14px;align-self:center}
.dict-target{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:6px 10px}
.dict-target b{font-weight:400;font-family:var(--f-display);color:var(--accent)}
.dict-input{width:100%;font:inherit;font-size:18px;padding:11px 14px;border:2px solid var(--accent);border-radius:12px;background:var(--surface);color:var(--ink)}
.dict-tabs{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px}
.dict-tabs button{flex:1;border:0;background:none;border-radius:9px;padding:6px 8px;font-size:14px}
.dict-tabs button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dict-body{flex:1;min-height:0;overflow-y:auto;display:grid;align-content:start;gap:8px;padding:2px 2px 8px;overscroll-behavior:contain}
.d-sum{font-size:13px;color:var(--muted)}
.d-sec{font-family:var(--f-display);font-size:16px;margin-top:4px}
.dentry{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:3px}
.d-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.d-word{font-family:var(--f-en);font-weight:700;font-size:20px;line-height:1.3}
.pos{font-size:12px;border-radius:999px;padding:0 8px;border:1px solid var(--line);color:var(--muted)}
.pos.v{color:var(--accent);border-color:var(--accent)}
.pos.a{color:var(--g-narrative);border-color:var(--g-narrative)}
.pos.p{color:var(--g-procedure);border-color:var(--g-procedure)}
.d-cat{font-size:12px;color:var(--muted);margin-left:auto}
.lv{font-size:12px;border-radius:999px;padding:0 8px;background:var(--g-report);color:var(--surface)}
.lv.life{background:var(--g-procedure)}
.d-tip{font-size:14px;background:var(--sunk);border-left:3px solid var(--g-procedure);border-radius:8px;padding:6px 10px;display:grid;gap:2px}
.d-tip b{font-family:var(--f-display);font-weight:400}
.d-tip .ex{font-family:var(--f-en);font-weight:700}
.d-ko{font-size:16px}
.d-forms{font-size:14px;color:var(--muted)}
.d-forms b{font-family:var(--f-en);color:var(--ink)}
.d-hint{justify-self:start;font-size:13px;background:var(--mark);color:var(--mark-ink);border-radius:8px;padding:2px 8px}
.d-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.d-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:4px 10px;font-size:13px;line-height:1.4}
.d-btn.ins{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.d-btn.ins span{font-family:var(--f-en);font-weight:700}
.d-btn[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink);border-color:transparent}
.d-none{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.d-none p{margin:0}
.wp-h{gap:6px}
.wp-h h3{margin-right:auto}
.wp-dict{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:8px;padding:3px 10px;font-size:13px}
@media (min-width:921px){
  body.dict-on{padding-right:484px}
  body.dict-on .wordpanel{display:none}
  body.dict-on .write, body.dict-on .revise, body.dict-on .learn{grid-template-columns:minmax(0,1fr)}
  body.dict-on .side{position:static}
}
@media (max-width:920px){
  .dict{width:100%;border-left:0;box-shadow:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body.dict-on{overflow:hidden}
}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:15px;z-index:70;max-width:calc(100% - 32px)}

@media (max-width:920px){
  .learn,.revise{grid-template-columns:1fr}
  .side{position:static}
  .write{grid-template-columns:1fr}
  .wordpanel{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:70vh;border-radius:18px 18px 0 0;z-index:40;
    padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .25s}
  .wordpanel.open{transform:none}
  .wp-close{display:block}
  .wp-fab{display:block;position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 18px;font-family:var(--f-display);font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
}
@media (max-width:560px){
  .mpart{grid-template-columns:1fr;gap:4px}
  .levels button span{display:none}
  .sheet{padding:20px 16px 20px 46px}
  .sheet{background-image:linear-gradient(90deg,transparent 30px,var(--margin) 30px,var(--margin) 32px,transparent 32px)}
}
@media (prefers-reduced-motion:reduce){.wordpanel{transition:none}}


/* level-up */
.lvup{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--ok-bg);border:2px solid var(--ok);border-radius:18px;padding:12px 16px;font-size:16px}
.lvup b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--ok)}

.stage,.stages,.frames,.fr,.frame{min-width:0}
.frame select{max-width:100%;min-width:0;text-overflow:ellipsis}

/* one stage at a time */
.wtop{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.wtop .aud-pill{margin:0}
.fade-btn{margin-left:auto}
.spills{display:flex;flex-wrap:wrap;gap:6px}
.spill{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 6px;font-family:var(--f-display);font-size:16px;box-shadow:0 3px 0 var(--press)}
.spill .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);border:2px solid var(--line);font-family:var(--f-en);font-weight:700;font-size:13px}
.spill.done .n{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.spill[aria-pressed="true"]{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 10%,var(--surface));box-shadow:0 3px 0 var(--gc)}
.spill[aria-pressed="true"] .n{background:var(--gc);border-color:var(--gc);color:#fff}
.next-row{display:flex;justify-content:flex-end}
.stages.noframe .frames{display:none}

/* word-by-word copy */
.cw-sent{font-family:var(--f-en);font-size:20px;line-height:1.6}
.cw-done{color:var(--ok)}
.cw-cur{background:var(--mark);color:var(--mark-ink);border-radius:6px;padding:0 4px;font-weight:700}
.cw-todo{color:var(--muted)}
.cw-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cw-big{font-family:var(--f-en);font-size:46px;font-weight:700;letter-spacing:.08em;line-height:1.2}
.c-next{color:var(--ink);border-bottom:4px solid var(--gc);animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{border-bottom-color:transparent}}
@media (prefers-reduced-motion:reduce){ .c-next{animation:none} }

/* level lock & together mode */
.levels.locked button:not([aria-pressed="true"]){display:none}
.levels.locked button{cursor:default}
.tg-pill{font-family:var(--f-display);font-size:16px;background:var(--sun);color:#3B2A00;border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 #D9A21E}
body.together{font-size:20px}
body.together .paper{font-size:26px}
body.together .frame,body.together .blank{font-size:22px}
body.together .mpart .txt,body.together .sm-card .txt{font-size:22px}
body.together .stage-q,body.together .tip{font-size:19px}
body.together .rp-text,body.together .sheet .body{font-size:28px}
body.together .xsent,body.together .xq,body.together .chip{font-size:18px}

/* field building */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fact{display:grid;gap:6px;align-content:start;border:2px solid var(--line);border-radius:18px;padding:12px 14px;background:var(--surface)}
.fact-h{display:flex;gap:8px;align-items:baseline}
.fact-h b{font-family:var(--f-en);font-size:20px;color:var(--gc)}
.fact-en{margin:0;font-family:var(--f-en);font-size:16px;line-height:1.6}
.fact .mko{margin:0}
.plan{display:grid;gap:12px}
.plan-row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center}
.plan-lbl{font-family:var(--f-display);font-size:17px;color:var(--gc)}
.plan-lbl small{font-family:var(--f-en);font-size:12px;color:var(--muted)}
.plan-in{width:100%;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:14px;padding:9px 12px;background:var(--surface);color:var(--ink)}
.plan-in:focus{border-color:var(--gc)}
.chip.aud{font-family:var(--f-display);font-size:15px}
.chip.aud[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:#fff}
.plan-note{font-size:15px;background:var(--sunk);border-radius:12px;padding:6px 12px}
.plan-note b{font-family:var(--f-display);font-weight:400;color:var(--gc)}
.aud-pill{display:inline-block;margin-bottom:14px;font-size:15px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px}
.aud-pill b{font-family:var(--f-display);font-weight:400;color:var(--gc)}
@media (max-width:560px){ .plan-row{grid-template-columns:1fr;gap:4px} }

/* deconstruction */
.learn-tabs{margin-bottom:2px}
.hunt-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.hunt-status{font-family:var(--f-display);font-size:18px;color:var(--gc)}
.hunt-status.done{color:var(--ok)}
.hunt .hw{cursor:pointer;border-radius:5px;transition:background .15s}
.hunt .hw:hover{background:color-mix(in srgb,var(--gc) 10%,transparent)}
.hunt .hg.found .hw{background:var(--mark);color:var(--mark-ink)}
.hunt .hg.found.shown:not(.mine) .hw{outline:2px dashed var(--warn)}
.hw.miss{animation:miss .45s}
@keyframes miss{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.sm-card{display:grid;gap:8px;padding:12px 14px;border-radius:18px;background:var(--sunk);border:2px dashed var(--line)}
.sm-card.right{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 6%,var(--surface))}
.sm-tag{justify-self:start;font-family:var(--f-display);font-size:15px;padding:2px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.sm-card.right .sm-tag{background:var(--ok);border-color:var(--ok);color:#fff}
.sm-chips{display:flex;flex-wrap:wrap;gap:6px}
.sm-chip{font-family:var(--f-display);font-size:15px}
.sm-en{font-family:var(--f-en);font-size:12px;color:var(--muted)}
.sm-chip.no{border-color:var(--red);animation:miss .45s}
@media (prefers-reduced-motion:reduce){ .hw.miss,.sm-chip.no{animation:none} }

/* read-aloud */
.ra-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ra-status{font-family:var(--f-display);font-size:17px;color:var(--gc,var(--accent));margin-left:4px}
.rs{cursor:pointer;border-radius:8px;padding:0 2px;transition:background .15s}
.rs:hover{background:color-mix(in srgb,var(--gc,var(--accent)) 10%,transparent)}
.rs.now{background:var(--mark);color:var(--mark-ink)}
.rs.your-turn{background:color-mix(in srgb,var(--ok) 22%,transparent);outline:2px dashed var(--ok);outline-offset:1px}

/* auto feedback emphasis */
.chk li{color:var(--muted)}
.chk li.no{color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--red) 8%,var(--surface));border:2px solid color-mix(in srgb,var(--red) 45%,transparent);border-radius:12px;padding:7px 10px 7px 34px;font-size:15px}
.chk li.no::before{content:"✗";color:var(--red);left:12px;top:7px;font-size:16px}
.chk li.no code{color:var(--red)}
.crit.s1{border-color:var(--red);background:color-mix(in srgb,var(--red) 7%,var(--surface))}
.crit.s1 .lb{color:var(--red)}
.crit.s2{border-color:var(--warn)}
.crit-card.low h4{color:var(--red)}
.fix-box{display:grid;gap:8px;border:3px solid var(--red);border-radius:18px;padding:12px 14px;background:color-mix(in srgb,var(--red) 5%,var(--surface))}
.fix-box.soft-only{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 6%,var(--surface))}
.fix-h{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-display)}
.fix-h b{font-weight:400;font-size:19px;color:var(--red)}
.fix-h b.soft{color:var(--warn);font-size:17px}
.fix-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fix-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:15px}
.fx-word{font-family:var(--f-en);font-weight:700;font-size:18px;color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);border-radius:6px;padding:0 6px;text-decoration:underline wavy var(--red);text-underline-offset:4px}
.fix-list li.soft .fx-word{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);text-decoration:underline dashed var(--warn)}
.fx-where{font-size:12px;color:var(--muted);margin-left:auto}
.fb-text mark.err.soft{background:color-mix(in srgb,var(--warn) 18%,transparent);font-weight:700}

/* red pen */
mark.err{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);font-weight:700;text-decoration:underline wavy var(--red);text-underline-offset:4px;border-radius:4px;cursor:pointer;padding:0 1px}
mark.err.soft{background:transparent;color:inherit;font-weight:inherit;text-decoration:underline dashed var(--warn);text-decoration-thickness:2px}
.err-miss{color:var(--red);font-weight:700;background:color-mix(in srgb,var(--red) 15%,transparent);border-radius:4px;padding:0 3px;cursor:pointer}
.redpen{border:2px solid var(--red);border-radius:16px;padding:10px 14px;display:grid;gap:6px;background:color-mix(in srgb,var(--red) 4%,var(--surface))}
.rp-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-family:var(--f-display)}
.rp-h b{color:var(--red);font-weight:400;font-size:18px}
.rp-soft{color:var(--warn);font-size:15px}
.rp-text{font-family:var(--f-en);font-size:19px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
.rp-msg{font-family:var(--f-display);font-size:16px;color:var(--red);min-height:1.2em}
.rp-msg:empty{display:none}

/* past tense finder */
.pt{display:grid;gap:12px;margin-top:18px}
.pt-input{width:100%;max-width:420px;font-family:var(--f-en);font-size:22px;padding:10px 14px;border:2px solid var(--gc);border-radius:16px;background:var(--surface);color:var(--ink)}
.pt-out{display:grid;gap:10px}
.pt-out:empty{display:none}
.pt-card{display:grid;gap:6px;justify-items:start;background:color-mix(in srgb,var(--gc) 7%,var(--surface));border:2px solid color-mix(in srgb,var(--gc) 30%,var(--line));border-radius:18px;padding:14px 18px}
.pt-main{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-family:var(--f-en);font-weight:700;font-size:32px;line-height:1.2}
.pt-arrow{color:var(--muted);font-weight:400}
.pt-past{color:var(--gc)}
.pt-tag{font-family:var(--f-display);font-weight:400;font-size:15px;border-radius:999px;padding:2px 12px}
.pt-tag.reg{background:var(--ok-bg);color:var(--ok)}
.pt-tag.irr{background:var(--warn-bg);color:var(--warn)}
.pt-ko{font-size:16px;color:var(--muted)}
.pt-why{font-family:var(--f-display);font-size:17px}
.pt-hint{font-size:14px;background:var(--mark);color:var(--mark-ink);border-radius:8px;padding:2px 8px}
@media (max-width:560px){ .pt-main{font-size:26px} }

/* intermediate */
.fr-all{display:flex;justify-content:flex-end}
.fr-all .add{border:0;background:var(--gc);color:#fff;border-radius:12px;padding:8px 22px;font-family:var(--f-display);font-size:17px;box-shadow:0 3px 0 color-mix(in srgb,var(--gc) 65%,#000)}
.bwrap{display:inline-flex}
.blank{border:0;border-bottom:3px solid var(--gc);background:color-mix(in srgb,var(--gc) 6%,var(--surface));border-radius:8px 8px 0 0;font-family:var(--f-en);font-size:18px;font-weight:700;color:var(--ink);padding:2px 6px;min-width:6ch;max-width:100%}
.blank:focus{outline:none;background:color-mix(in srgb,var(--gc) 14%,var(--surface))}
.xbox{display:grid;gap:8px;background:var(--tip);border:2px solid var(--tip-line);border-radius:16px;padding:10px 12px}
.xhead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.xhead b{font-family:var(--f-display);font-weight:400;font-size:17px}
.xsent{font-family:var(--f-en);font-weight:700;font-size:17px}
.xqs{display:flex;flex-wrap:wrap;gap:6px}
.xq{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-family:var(--f-display);font-size:15px;box-shadow:0 3px 0 var(--press)}
.xq[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--gc) 65%,#000)}
.xownwrap{display:inline-flex;gap:6px;align-items:center}
.xown{font-family:var(--f-en);font-size:16px;border:2px solid var(--line);border-radius:12px;padding:4px 10px;width:12em;max-width:100%;background:var(--surface);color:var(--ink)}

/* drill */
.drill-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.dprog{margin-left:auto;font-family:var(--f-display);font-size:18px;color:var(--muted)}
.dprog b{color:var(--warn);font-weight:400}
.drill{display:grid;gap:14px}
.dcard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--press);padding:16px 18px;display:grid;gap:8px;transition:border-color .2s}
.dcard.now{border-color:var(--gc);box-shadow:0 4px 0 var(--gc)}
.dhead{display:flex;justify-content:space-between;align-items:center}
.dnum{width:30px;height:30px;border-radius:10px;background:var(--gc);color:#fff;display:grid;place-items:center;font-family:var(--f-en);font-weight:700}

const $ = (s,el=document)=>el.querySelector(s);
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null || v===false) continue;
    if(k==="class") el.className=v;
    else if(k==="html") el.innerHTML=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if(k==="style") el.style.cssText=v;
    else el.setAttribute(k, v===true?"":v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))); }
  return el;
}
function marked(str){ // **x** -> <mark>, safe
  const frag = document.createDocumentFragment();
  str.split(/\*\*(.+?)\*\*/g).forEach((p,i)=> frag.append(i%2? h("mark",{},p) : document.createTextNode(p)));
  return frag;
}

/* insert text into a textarea at caret */
function insertInto(ta, str, opts={}){
  if(!ta){ toast("먼저 글을 쓸 칸을 눌러 주세요."); return; }
  const v = ta.value;
  let start = ta.selectionStart ?? v.length, end = ta.selectionEnd ?? v.length;
  if(document.activeElement!==ta && opts.append!==false){ start=end=v.length; }
  let pre = v.slice(0,start), post = v.slice(end), ins = str;
  if(opts.line){
    const lines = v.split("\n").filter(l=>l.trim()).length;
    ins = (opts.numbered ? (lines+1)+". " : "") + str;
    pre = v.replace(/\s+$/,""); post="";
    if(pre) pre += "\n";
  } else {
    if(pre && !/[\s(\["“]$/.test(pre)) ins = " " + ins;
    if(post && !/^[\s.,!?]/.test(post)) ins = ins + " ";
  }
  ta.value = pre + ins + post;
  const pos = (pre+ins).length;
  if(!opts.noFocus) ta.focus();
  try{ ta.setSelectionRange(pos,pos); }catch(e){}
  ta.dispatchEvent(new Event("input",{bubbles:true}));
}

const PRESENT_TO_PAST = {go:"went",goes:"went",eat:"ate",eats:"ate",play:"played",plays:"played",see:"saw",sees:"saw",is:"was",am:"was",are:"were",have:"had",has:"had",do:"did",does:"did",make:"made",makes:"made",come:"came",comes:"came",get:"got",gets:"got",take:"took",takes:"took",ride:"rode",rides:"rode",buy:"bought",buys:"bought",swim:"swam",run:"ran",find:"found",finds:"found",meet:"met",feel:"felt",feels:"felt",say:"said",says:"said",lose:"lost",loses:"lost",live:"lived",lives:"lived",watch:"watched",visit:"visited",help:"helped",look:"looked",looks:"looked"};
const PAST_TO_PRESENT = {was:"is / are",were:"are",lived:"live",ate:"eat",had:"have",went:"go",liked:"like",could:"can",swam:"swim",ran:"run",slept:"sleep",hunted:"hunt"};
const MODAL_BEFORE = new Set(["to","can","can't","cannot","will","could","couldn't","didn't","don't","doesn't","let's","would","should","must","did","not"]);
function tenseIssues(text, map){
  const clean = text.replace(/"[^"]*"|“[^”]*”/g," ");
  const toks = clean.match(/[A-Za-z']+/g)||[];
  const found = new Map();
  toks.forEach((w,i)=>{
    const lw = w.toLowerCase(), prev = (toks[i-1]||"").toLowerCase();
    if(map[lw] && !MODAL_BEFORE.has(prev)) found.set(lw, map[lw]);
  });
  return [...found.entries()].slice(0,4);
}
function checkStage(g, st, text){
  const out = []; const t = text.trim();
  if(!t){ out.push({k:"warn", m:"아직 비어 있어요. 이 부분을 채워 주세요."}); return out; }
  if(/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(t)) out.push({k:"warn", m:"한글이 섞여 있어요. 단어 도우미에서 영어 표현을 찾아 바꿔 보세요."});
  if(/(^|[\s"“])i(?=[\s'’.,!?]|$)/.test(t)) out.push({k:"warn", m:"'나'를 뜻하는 <code>i</code>는 항상 대문자 <code>I</code>로 써요."});
  if(!st.title){
    const sentences = t.split(/(?<=[.!?])\s+|\n+/).map(s=>s.replace(/^\s*\d+[.)]\s*/,"").replace(/^["“'(]+/,"").trim()).filter(Boolean);
    const low = sentences.filter(s=>/^[a-z]/.test(s)).slice(0,2);
    if(low.length) out.push({k:"warn", m:"문장은 대문자로 시작해요: " + low.map(s=>"<code>"+esc(s.split(" ").slice(0,3).join(" "))+"…</code>").join(", ")});
    const lines = st.numbered ? t.split("\n").filter(l=>l.trim()) : [t];
    if(lines.some(l=>!/[.!?"”]\s*$/.test(l.trim()))) out.push({k:"warn", m:"문장 끝에 마침표(.)나 느낌표(!)를 찍었는지 확인해요."});
    const need = (st.min||1) - (S.level===1?1:0);
    if(st.min && sentences.length < need) out.push({k:"tipi", m:`문장을 ${need}개 이상 써 보세요. (지금 ${sentences.length}개)`});
  }
  if(g.tense==="past"){
    const f = tenseIssues(t, PRESENT_TO_PAST);
    if(f.length) out.push({k:"warn", m:"지난 일이니 과거형으로 바꿔 볼까요? " + f.map(([a,b])=>`<code>${a}</code> → <code>${b}</code>`).join(", ")});
  }
  if(g.tense==="present"){
    const f = tenseIssues(t, PAST_TO_PRESENT);
    if(f.length) out.push({k:"warn", m:"사실을 알려 주는 글은 현재형으로 써요. " + f.map(([a,b])=>`<code>${a}</code> → <code>${b}</code>`).join(", ")});
  }
  if(g.id==="recount" && st.id==="events" && !/\b(first|then|next|after that|finally|later)\b/i.test(t))
    out.push({k:"tipi", m:"<code>First</code>, <code>Then</code> 같은 순서 말을 넣으면 읽기 쉬워요."});
  if(g.id==="procedure" && st.id==="steps"){
    const bad = t.split("\n").map(l=>l.replace(/^\s*\d+[.)]\s*/,"").replace(/^(first|then|next|after that|finally|second|third),?\s*/i,"")).filter(l=>/^(i|we|you|he|she|they)\b/i.test(l.trim()));
    if(bad.length) out.push({k:"warn", m:`방법은 동사로 시작해요. <code>${esc(bad[0].split(" ").slice(0,3).join(" "))}</code> → 주어를 빼고 <code>Put…</code>, <code>Cut…</code>처럼 써요.`});
  }
  if(g.id==="procedure" && st.id==="goal" && !/^how to/i.test(t)) out.push({k:"tipi", m:"제목을 <code>How to …</code>로 시작해 보세요."});
  if(g.id==="narrative" && st.id==="solution" && /said/i.test(t) && !/["“]/.test(t)) out.push({k:"tipi", m:"인물이 한 말은 따옴표(\" \") 안에 써요."});
  if(g.id==="exposition" && st.id==="thesis" && !/\b(think|should|believe|opinion|must)\b/i.test(t)) out.push({k:"tipi", m:"<code>I think</code>나 <code>should</code>로 내 주장을 분명하게 써 보세요."});
  if(g.id==="exposition" && st.id==="arguments" && !/\b(first|second|also|for example|in addition|another)\b/i.test(t)) out.push({k:"tipi", m:"<code>First</code>, <code>Second</code>로 이유를 나눠 보세요."});
  if(!out.length) out.push({k:"ok", m:"좋아요! 자동 점검에서 고칠 곳을 찾지 못했어요."});
  return out;
}

/* ---------------- learn: past tense finder ---------------- */
const PAST_CHIPS = {
  recount:["go","eat","see","play","have","make","ride","buy","take","swim","visit","watch"],
  narrative:["be","find","lose","say","come","run","fly","help","try","cry","stop","think"]
};
function pastRule(base, past){
  const b = base.toLowerCase(), p = past.toLowerCase();
  if(p.includes("/")) return {reg:false, why:"모양이 바뀌는 불규칙 동사예요. 외워 두세요!"};
  if(p===b) return {reg:false, why:"과거형도 모양이 그대로예요."};
  if(p===b+"d" && /e$/.test(b)) return {reg:true, why:"e로 끝나서 -d만 붙여요."};
  if(p===b.slice(0,-1)+"ied" && /[^aeiou]y$/.test(b)) return {reg:true, why:"y를 i로 바꾸고 -ed를 붙여요."};
  if(p===b+b.slice(-1)+"ed") return {reg:true, why:"끝 자음을 한 번 더 쓰고 -ed를 붙여요."};
  if(p===b+"ed") return {reg:true, why:"-ed를 붙여요."};
  return {reg:false, why:"모양이 바뀌는 불규칙 동사예요. 외워 두세요!"};
}
function regPast(v){
  if(/e$/.test(v)) return v+"d";
  if(/[^aeiou]y$/.test(v)) return v.slice(0,-1)+"ied";
  if(/^[^aeiou]*[aeiou][^aeiouwxy]$/.test(v)) return v+v.slice(-1)+"ed";
  return v+"ed";
}
function pastLookup(q){
  q = q.trim(); if(!q) return null;
  const ql = q.toLowerCase(), isKo = /[가-힣ㄱ-ㅎ]/.test(q);
  let e = DICT.find(x=>x.p==="v" && x.past && x.wl===ql), from = "base";
  if(!e){ e = DICT.find(x=>x.p==="v" && x.pastL.includes(ql)); if(e) from = "past"; }
  if(!e && isKo){
    const vs = dictSearch(q).filter(x=>x.e.p==="v" && x.e.past);
    if(vs.length) return {list: vs.filter(x=>x.sc===vs[0].sc).slice(0,3).map(x=>({e:x.e, from:"ko"}))};
  }
  if(!e && !isKo){ for(const [w] of enCands(ql)){ const f = DICT.find(x=>x.p==="v" && x.past && x.wl===w); if(f){ e=f; from="form"; break; } } }
  if(e) return {list:[{e, from}]};
  if(!isKo && /^[a-z]+$/.test(ql)) return {guess:true, base:ql, past:regPast(ql)};
  return null;
}
function pastCorner(g){

    out);

let learnTab = "model";
function featureHunt(g, model){
  let groups = 0, found = 0;
  const status = h("span",{class:"hunt-status"});
  const upd = ()=>{ status.textContent = `찾은 말 ${found} / ${groups}`; if(found===groups && groups) { status.textContent = "다 찾았어요!"; status.classList.add("done"); } };
  const allMarks = [];
  const parts = g.stages.map(st=>{
    const txt = h("div",{class:"txt hunt",lang:"en"});
    (model[st.id]||"").split(/\*\*(.+?)\*\*/g).forEach((seg,i)=>{
      if(i%2){
        const grp = h("span",{class:"hg"}); groups++; allMarks.push(grp);
        seg.split(/(\s+)/).forEach(w=>{ if(/^\s+$/.test(w)){ grp.append(w); return; }
          grp.append(h("span",{class:"hw",onclick:()=>{ if(grp.classList.contains("found")) return; grp.classList.add("found"); found++; upd(); }},w)); });
        txt.append(grp);

function expandBox(g, st, ta){
  const box = h("div",{class:"xbox"});
  let qi = -1;
  const target = ()=>{
    const v = ta.value;
    const segs = [...v.matchAll(/[^.!?\n]+(?:[.!?]+["”]?)?/g)].filter(m=>/[a-z]/i.test(m[0]));
    if(!segs.length) return null;
    const c = ta.selectionStart ?? v.length;
    const m = segs.find(m=>c>=m.index && c<=m.index+m[0].length) || segs[segs.length-1];
    return {start:m.index, text:m[0]};
  };
  const add = (phrase, sentence)=>{
    const t = target(); if(!t) return;
    const v = ta.value, end = t.start + t.text.length;
    let pos;
    if(sentence) pos = end;
    else { const m = t.text.match(/([.!?]+["”]?)\s*$/); pos = m ? end - m[0].length : t.start + t.text.trimEnd().length; }
    const pre = v.slice(0,pos).replace(/[ \t]+$/,""), ins = " "+phrase;
    ta.value = pre + ins + v.slice(pos);
    try{ ta.setSelectionRange(pre.length+ins.length-(sentence?0:0), pre.length+ins.length); }catch(e){}
    ta.dispatchEvent(new Event("input",{bubbles:true}));
    toast(`+${phrase.split(/\s+/).length} 단어`);
  };
  const draw = ()=>{
    const t = target();
    box.replaceChildren();
    box.hidden = !t;
    if(!t) return;
    box.append(
      h("div",{class:"xhead"}, h("b",{},"문장 늘리기"), h("span",{class:"xsent",lang:"en"}, t.text.trim())),

    if(qi>=0){

      const own = h("input",{class:"xown",lang:"en",placeholder:"직접 쓰기",autocomplete:"off"});
      const put = ()=>{ if(own.value.trim()) add(own.value.trim(), x.sentence); };
      own.addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); put(); } });
      box.append(h("div",{class:"starters"},
        x.items.map(it=>h("button",{class:"chip",type:"button",lang:"en",onclick:()=>add(it, x.sentence)},it)),
        h("span",{class:"xownwrap"}, own, h("button",{class:"btn small",type:"button",onclick:put},"붙이기"))));
    }
  };
  ["click","keyup"].forEach(ev=>ta.addEventListener(ev, draw));
  draw();
  return {box, draw};
}

/* ---------------- red pen: locate errors in the student's text ---------------- */
const FUNC_WORDS = "a an the i you he she it we they me him her us them my your his its our their mine yours this that these those there here what who whom whose which where when why how is am are was were be been being do does did done have has had to of in on at by for with from up down out over into onto about as than then so and but or if because not no yes very too also just only all some any many much more most few little lot lots can could will would shall should may might must let ok okay oh wow hi hello bye mr mrs ms dr st".split(" ");
let _known = null;
function knownSet(){
  if(_known) return _known;
  const K = new Set(FUNC_WORDS);
  const addText = t=>String(t||"").toLowerCase().replace(/[^a-z' ]+/g," ").split(/\s+/).forEach(w=>{ w=w.replace(/^'+|'+$/g,""); if(w) K.add(w); });
  DICT.forEach(e=>{ addText(e.w); addText(e.past); addText(e.pp); addText(e.ins); });
  GENRES.forEach(g=>{ [g.model,g.model_adv].forEach(m=>Object.values(m||{}).forEach(addText));
    g.stages.forEach(st=>(st.frames||[]).forEach(fr=>addText(fr.en.replace(/=[^|\]]*/g,"").replace(/[\[\]|]/g," ")))); });
  return _known = K;
}
function isKnown(w){
  const K = knownSet(); w = w.toLowerCase().replace(/^'+|'+$/g,"");
  if(K.has(w) || /^\d/.test(w)) return true;
  const base = w.replace(/'(s|t|re|ve|ll|d|m)$/,"");
  if(base!==w && (K.has(base) || /^(don|can|won|isn|aren|wasn|weren|didn|doesn|couldn|shouldn|wouldn|haven|hasn|hadn)$/.test(base))) return true;
  for(const [c,kind] of enCands(w)){
    if(kind==="ed"){
      const v = DICT.find(e=>e.p==="v" && e.wl===c && e.pastL.length);
      if(v){ if(v.pastL.includes(w) || v.ppL.includes(w)) return true; return {fix:v.past.split(" / ")[0]}; }
      continue;
    }
    if(K.has(c)) return true;
  }
  return false;
}
function findErrors(g, st, text){
  const E = [];
  if(!text || !text.trim()) return E;
  const quotes = [...text.matchAll(/"[^"]*"|“[^”]*”/g)].map(m=>[m.index, m.index+m[0].length]);
  const inQuote = i=>quotes.some(([a,b])=>i>a && i<b);
  for(const m of text.matchAll(/[ㄱ-ㅎㅏ-ㅣ가-힣]+/g)) E.push({s:m.index, e:m.index+m[0].length, msg:"한글이에요. 영어로 바꿔 써요."});
  for(const m of text.matchAll(/(^|[^A-Za-z'’])(i)(?=['’\s.,!?]|$)/g)){ const s=m.index+m[1].length; E.push({s, e:s+1, msg:"'나'를 뜻하는 I는 항상 대문자예요."}); }
  if(!st.title){
    const starts = [0, ...[...text.matchAll(/[.!?]["”]?\s+|\n+/g)].map(m=>m.index+m[0].length)];
    for(let p of starts){
      const pre = text.slice(p).match(/^\s*(\d+[.)]\s*)?["“'(]*/)[0]; p += pre.length;
      const w = text.slice(p).match(/^[a-z][A-Za-z']*/);
      if(w && w[0]!=="i" && !inQuote(p)) E.push({s:p, e:p+w[0].length, msg:"문장은 대문자로 시작해요."});
    }
    let off = 0;
    text.split("\n").forEach(line=>{
      const t = line.replace(/\s+$/,"");
      if(/[A-Za-z]/.test(t) && !/[.!?"”]$/.test(t)) E.push({s:off+t.length, e:off+t.length, miss:true, msg:"문장 끝에 마침표(.)를 찍어요."});
      off += line.length+1;
    });
  }
  const map = g.tense==="past" ? PRESENT_TO_PAST : g.tense==="present" ? PAST_TO_PRESENT : null;
  const toks = [...text.matchAll(/[A-Za-z']+/g)];
  toks.forEach((m,k)=>{
    const lw = m[0].toLowerCase(), prev = k ? toks[k-1][0].toLowerCase() : "";
    if(map && map[lw] && !MODAL_BEFORE.has(prev) && !inQuote(m.index))
      E.push({s:m.index, e:m.index+m[0].length, soft:true, msg: g.tense==="past" ? `지난 일이면 ${map[lw]}(으)로 바꿔요.` : `사실을 말할 때는 ${map[lw]}(으)로 써요.`});
    else if(m[0].length>1 && isKnown(m[0]).fix) E.push({s:m.index, e:m.index+m[0].length, msg:`과거형은 ${isKnown(m[0]).fix}(이)에요.`});
    else if(m[0].length>1 && isKnown(m[0])!==true && !(/^[A-Z]/.test(m[0]) && k>0 && !/[.!?\n]\s*["“]?$/.test(text.slice(toks[k-1].index+toks[k-1][0].length, m.index))))
      E.push({s:m.index, e:m.index+m[0].length, soft:true, msg:"사전에 없는 단어예요. 철자를 확인해요."});
  });
  if(g.id==="procedure" && st.id==="steps"){
    let off = 0;
    text.split("\n").forEach(line=>{
      const m = line.match(/^(\s*\d+[.)]\s*)?((first|then|next|after that|finally|second|third|now),?\s*)?(I|We|You|He|She|They)\b/i);
      if(m){ const s = off + (m[1]||"").length + (m[2]||"").length; E.push({s, e:s+m[4].length, msg:"방법은 동사로 시작해요. 주어를 빼요."}); }
      off += line.length+1;
    });
  }
  /* 주어와 be동사, 반복 단어, a/an, 3인칭 -s */
  toks.forEach((m,k)=>{
    if(!k) return;
    const cur = m[0].toLowerCase(), pm = toks[k-1], prev = pm[0].toLowerCase(), prev2 = k>1 ? toks[k-2][0].toLowerCase() : "";
    if(!/^[ \t]+$/.test(text.slice(pm.index+pm[0].length, m.index))) return;
    let fix = null;
    if(prev==="i" && (cur==="is"||cur==="are")) fix = "am";
    else if(prev==="i" && cur==="were" && !["if","wish"].includes(prev2)) fix = "was";
    else if(["he","she","it"].includes(prev) && cur==="are") fix = "is";
    else if(["he","she","it"].includes(prev) && cur==="were" && prev2!=="if") fix = "was";
    else if(["we","they","you"].includes(prev) && (cur==="is"||cur==="am")) fix = "are";
    else if(["we","they","you"].includes(prev) && cur==="was") fix = "were";
    if(fix) E.push({s:m.index, e:m.index+m[0].length, msg:`${pm[0]} 뒤에는 ${fix}${fix==="am"?"을":"를"} 써요.`});
    if(cur===prev && !/^(had|that)$/.test(cur)) E.push({s:m.index, e:m.index+m[0].length, msg:"같은 단어를 두 번 썼어요."});
    if(prev==="a" && /^[aeio]/.test(cur) && !/^(one|once)/.test(cur)) E.push({s:pm.index, e:pm.index+1, soft:true, msg:`모음 소리 앞에서는 an을 써요: an ${m[0]}`});
    if(prev==="an" && /^[bcdfgjklmnpqrstvwxyz]/.test(cur)) E.push({s:pm.index, e:pm.index+2, soft:true, msg:`자음 소리 앞에서는 a를 써요: a ${m[0]}`});
    if(g.tense==="present" && ["he","she","it"].includes(prev) && sets().verbs.has(cur) && !/s$/.test(cur) && !/^(can|will|should|must|may|might|could|would|did|do|does|be)$/.test(cur))
      E.push({s:m.index, e:m.index+m[0].length, soft:true, msg:`${pm[0]} 다음에는 ${thirdS(cur)}처럼 -s를 붙여요.`});
  });
  E.sort((a,b)=>a.s-b.s || (a.soft?1:0)-(b.soft?1:0));
  return E;
}
function thirdS(v){
  if(v==="have") return "has"; if(v==="do") return "does"; if(v==="go") return "goes";
  if(/(s|x|z|ch|sh|o)$/.test(v)) return v+"es";
  if(/[^aeiou]y$/.test(v)) return v.slice(0,-1)+"ies";
  return v+"s";
}
function markText(text, errs){
  const frag = document.createDocumentFragment(); let p = 0;
  errs.forEach((er,i)=>{
    if(er.s < p) return;
    if(er.s > p) frag.append(text.slice(p, er.s));
    if(er.miss) frag.append(h("span",{class:"err-miss",title:er.msg,"data-i":String(i)},"."));
    else frag.append(h("mark",{class:er.soft?"err soft":"err",title:er.msg,"data-i":String(i)}, text.slice(er.s, er.e)));
    p = Math.max(p, er.e);
  });
  frag.append(text.slice(p));
  return frag;
}
function hardErrors(g){ return g.stages.reduce((n,st)=>n+findErrors(g,st,T(g.id,st.id)).filter(e=>!e.soft).length, 0); }
function redPen(g, st, ta){
  const box = h("div",{class:"redpen"});
  let errs = [];
  const msg = h("div",{class:"rp-msg"});
  const draw = ()=>{
    const t = ta.value; errs = findErrors(g, st, t);
    box.hidden = !errs.length;
    if(!errs.length) return;
    const hard = errs.filter(e=>!e.soft).length, soft = errs.length-hard;
    msg.textContent = "";
    box.replaceChildren(
      h("div",{class:"rp-h"}, hard ? h("b",{},`꼭 고칠 곳 ${hard}개`) : null, soft ? h("span",{class:"rp-soft"},`확인할 곳 ${soft}개`) : null),
      h("div",{class:"rp-text",lang:"en"}, markText(t, errs)), msg);
  };
  box.addEventListener("click",e=>{
    const el = e.target.closest("[data-i]"); if(!el) return;
    const er = errs[+el.dataset.i]; if(!er) return;
    msg.textContent = "→ " + er.msg;
    try{ ta.focus({preventScroll:true}); ta.setSelectionRange(er.s, er.e); }catch(x){}
  });
  draw();
  return {box, draw};
}

function aiFeedback(g){

    const maxFix = S.level===1?3:5;
    try{

`You are a kind English teacher giving revision feedback to a Korean 6th-grade EFL student (about age 12). Writing level: ${LV_DESC[S.level]}.
Genre: ${g.en} (${g.ko}). Purpose: ${g.purpose}
Expected stages in order: ${g.stages.map(s=>s.en).join(" → ")}. Key language features: ${g.features.map(f=>f.t+" ("+f.ex+")").join("; ")}.

Student's text by stage:
${body}

Rules:

- Write all comments in simple, warm Korean a 12-year-old understands. One sentence each.
Reply with only JSON:
{"praise":"잘한 점 1~2문장","stages":[{"stage":"<stage name in English>","comment":"한 문장 조언"}],"fixes":[{"original":"...","better":"...","why":"짧은 이유"}],"next":"다음에 도전할 한 가지"}`,

          apply.disabled=true; apply.textContent="바꿨어요";
        });
        out.append(h("div",{class:"fix"},h("span",{class:"from"},String(f.original)),h("span",{class:"to"},String(f.better)),h("span",{class:"why"},String(f.why||"")),apply));
      });

      if(!out.children.length) out.append(h("div",{class:"note"},"피드백을 만들지 못했어요. 다시 눌러 주세요."));

function composed(g){
  const parts = g.stages.map(st=>({st, t:T(g.id,st.id).trim()})).filter(p=>p.t);
  return parts;
}
function plainText(g){
  return composed(g).map(({st,t})=>t).join("\n\n");
}
function levelUp(g){
  if(!composed(g).length) return null;
  const A = analyze(g);
  if(!A.every(c=>c.score===3)) return null;
  const names = {1:"Beginner",2:"Intermediate",3:"Advanced"};
  let msg, act = null;
  if(S.level===3) msg = "모든 기준에서 별 3개! 다른 장르에도 도전해 봐요.";
  else if(!S.noFrame) msg = "모든 기준에서 별 3개! 다음 글은 쓰기 화면의 '틀 없이 쓰기'를 켜고 도전해 봐요.";
  else if(lockedLevel) msg = `틀 없이도 별 3개! 선생님께 ${names[S.level+1]} 단계로 바꿔 달라고 말씀드려요.`;
  else { msg = `틀 없이도 별 3개! 다음 글은 ${names[S.level+1]} 단계로 도전해 볼까요?`;
    act = h("button",{class:"btn small primary",type:"button",onclick:()=>{ S.level++; S.genre=null; save(); render(); toast(`${names[S.level]} 단계로 바꿨어요.`); }}, `${names[S.level+1]}로 바꾸기`); }
  return h("div",{class:"lvup"}, h("b",{},"다음 도전"), h("span",{},msg), act);
}

/* ---------------- read-aloud for the finished text ---------------- */
let activeReader = null;
function readAloud(els){
  let timer = null, run = 0;
  const texts = els.map(e=>e.textContent);
  const clear = ()=>els.forEach(e=>e.classList.remove("now","your-turn"));
  const stop = ()=>{ run++; clearTimeout(timer); try{ speechSynthesis.cancel(); }catch(e){} clear(); status.textContent=""; };
  const speakOne = (i, done)=>{
    try{
      const u = new SpeechSynthesisUtterance(texts[i]); u.lang="en-US"; u.rate = drillSlow?0.6:0.9;
      u.onstart = ()=>{ clear(); els[i].classList.add("now"); els[i].scrollIntoView({block:"nearest",behavior:"smooth"}); };
      u.onend = ()=>done && done();
      u.onerror = ()=>done && done();
      speechSynthesis.speak(u);
    }catch(e){ done && done(); }
  };
  const playAll = ()=>{ stop(); const my = ++run;
    const next = i=>{ if(my!==run) return; if(i>=texts.length){ clear(); return; } speakOne(i, ()=>next(i+1)); };
    next(0); };
  const shadow = ()=>{ stop(); const my = ++run;
    const next = i=>{ if(my!==run) return;
      if(i>=texts.length){ clear(); status.textContent="다 했어요!"; return; }
      status.textContent = `${i+1} / ${texts.length} 듣기`;
      speakOne(i, ()=>{ if(my!==run) return;
        els[i].classList.remove("now"); els[i].classList.add("your-turn"); status.textContent = `${i+1} / ${texts.length} 따라 말해요`;
        const words = texts[i].split(/\s+/).length, gap = Math.round((words*0.55 + 1.2) * (drillSlow?1.5:1) * 1000);
        timer = setTimeout(()=>{ els[i].classList.remove("your-turn"); next(i+1); }, gap); });
    };
    next(0); };
  const one = i=>{ stop(); speakOne(i, ()=>setTimeout(clear,300)); };
  const status = h("span",{class:"ra-status"});
  const slow = h("button",{class:"btn small",type:"button","aria-pressed":String(drillSlow)},"천천히");
  slow.addEventListener("click",()=>{ drillSlow=!drillSlow; slow.setAttribute("aria-pressed",String(drillSlow)); });
  const bar = h("div",{class:"ra-bar"},
    h("button",{class:"btn primary",type:"button",onclick:playAll},"전체 듣기"),
    h("button",{class:"btn",type:"button",onclick:shadow},"따라 말하기"),
    h("button",{class:"btn small",type:"button",onclick:stop},"멈춤"),
    slow, status);
  activeReader = {stop};
  return {bar, one, stop};
}

/* ---------------- Beginner drill: listen & repeat ---------------- */
let drillSlow = false;
function DR(g){ S.drill ||= {}; return (S.drill[g.id] ||= {}); }
function allSents(g){ return g.stages.flatMap(st=>splitSents(T(g.id,st.id),st)); }
const DRILL_KEYS = ["say","order","copy"];
function drillStars(g){ const D=DR(g); return allSents(g).reduce((a,s)=>a+DRILL_KEYS.filter(k=>(D[s]||{})[k]).length,0); }
function say(text){
  if(!canSpeak) return;
  try{ const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=drillSlow?0.6:0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}

function drillCard(g, s, i, ko, onChange){
  const D = DR(g), st = (D[s] ||= {say:false,order:false,copy:false});
  const words = s.split(/\s+/).filter(Boolean);
  const card = h("article",{class:"dcard"});
  const stars = h("span",{class:"dstars"});
  const area = h("div",{class:"darea"});
  let mode = "";
  const drawStars = ()=>{ stars.replaceChildren(starsEl(DRILL_KEYS.filter(k=>st[k]).length)); onChange(); };
  const label = (b,t,k)=>{ b.textContent = t+(st[k]?" ✓":""); b.classList.toggle("done",!!st[k]); };

  const sayBtn = h("button",{class:"btn small",type:"button"});
  sayBtn.addEventListener("click",()=>{ st.say=!st.say; save(); label(sayBtn,"따라 말했어요","say"); drawStars(); });
  const orderBtn = h("button",{class:"btn small",type:"button"});
  const copyBtn = h("button",{class:"btn small",type:"button"});
  label(sayBtn,"따라 말했어요","say"); label(orderBtn,"순서 맞추기","order"); label(copyBtn,"보고 쓰기","copy");

  function openOrder(){
    if(mode==="order"){ mode=""; area.replaceChildren(); return; }
    mode="order";
    let pool = words.map((w,k)=>({w,k}));
    for(let t=0;t<6;t++){ pool.sort(()=>Math.random()-.5); if(words.length<2 || pool.some((x,k)=>x.k!==k)) break; }
    let ans = [];
    const ansEl=h("div",{class:"oans"}), poolEl=h("div",{class:"opool"}), msg=h("span",{class:"omsg"});
    const draw=()=>{
      ansEl.replaceChildren(...ans.map((x,j)=>h("button",{class:"ochip",type:"button",lang:"en",onclick:()=>{ ans.splice(j,1); pool.push(x); draw(); }},x.w)));
      poolEl.replaceChildren(...pool.map((x,j)=>h("button",{class:"ochip",type:"button",lang:"en",onclick:()=>{ pool.splice(j,1); ans.push(x); say(x.w.replace(/[^A-Za-z'-]/g,"")); draw(); check(); }},x.w)));
    };
    const check=()=>{
      if(ans.length<words.length) return;
      if(ans.map(x=>x.w).join(" ")===words.join(" ")){
        msg.textContent="정답!"; msg.className="omsg ok"; say(s);
        if(!st.order){ st.order=true; save(); label(orderBtn,"순서 맞추기","order"); drawStars(); }
      } else {
        msg.textContent="다시!"; msg.className="omsg bad";
        setTimeout(()=>{ pool=pool.concat(ans); ans=[]; msg.textContent=""; draw(); },900);
      }
    };
    draw();
    area.replaceChildren(h("div",{class:"order"}, ansEl, poolEl, msg));
  }
  function openCopy(){
    if(mode==="copy"){ mode=""; area.replaceChildren(); return; }
    mode="copy";
    /* 한 단어씩: 지금 쓸 단어를 크게 보여 주고, 다음에 칠 글자를 표시해요 */
    const core = w=>w.replace(/[^A-Za-z']/g,"");
    let wi = 0;
    while(wi<words.length && !core(words[wi])) wi++;
    const line = h("div",{class:"cw-sent",lang:"en"});
    const big = h("div",{class:"cw-big",lang:"en"});
    const inp = h("input",{class:"cinput",lang:"en",autocomplete:"off",autocapitalize:"off",spellcheck:"false","aria-label":"보고 쓰기"});
    const hear = canSpeak ? h("button",{class:"btn small",type:"button",onclick:()=>{ if(wi<words.length) say(core(words[wi])); }},"단어 듣기") : null;
    const draw = ()=>{
      line.replaceChildren(...words.flatMap((w,k)=>[k?" ":"", h("span",{class: k<wi ? "cw-done" : k===wi ? "cw-cur" : "cw-todo"}, w)]));
      if(wi>=words.length){
        big.replaceChildren(h("span",{class:"c-ok"},"다 썼어요!")); inp.hidden = true; if(hear) hear.hidden = true;
        if(!st.copy){ st.copy=true; save(); label(copyBtn,"보고 쓰기","copy"); drawStars(); say(s); }
        return;
      }
      const target = core(words[wi]), v = inp.value;
      big.replaceChildren(...[...target].map((ch,k)=>h("span",{class: k<v.length ? (v[k].toLowerCase()===ch.toLowerCase() ? "c-ok" : "c-bad") : k===v.length ? "c-next" : "c-todo"}, ch)));
    };
    inp.addEventListener("input",()=>{
      inp.value = inp.value.replace(/\s+/g,"");
      if(wi<words.length && inp.value.toLowerCase()===core(words[wi]).toLowerCase()){
        wi++; while(wi<words.length && !core(words[wi])) wi++;
        inp.value = "";
      }
      draw();
    });
    draw();
    area.replaceChildren(h("div",{class:"copy"}, line, h("div",{class:"cw-row"}, big, hear), inp));
    setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} });
  }
  orderBtn.addEventListener("click",openOrder);
  copyBtn.addEventListener("click",openCopy);

  card.append(
    h("div",{class:"dhead"}, h("span",{class:"dnum"},i+1), stars),
    h("div",{class:"dsent",lang:"en"}, words.map(w=>h("button",{class:"wbtn",type:"button",onclick:()=>say(w.replace(/[^A-Za-z'-]/g,""))},w))),
    ko ? h("div",{class:"dko"},ko) : null,
    h("div",{class:"dacts"}, canSpeak ? h("button",{class:"btn small primary",type:"button",onclick:()=>say(s)},"듣기") : null, sayBtn, orderBtn, copyBtn),
    area);
  stars.replaceChildren(starsEl(DRILL_KEYS.filter(k=>st[k]).length));
  return card;
}

function renderDrill(g){

  if(!list.length) return h("div",{}, h("section",{class:"panel"}, h("p",{class:"muted",style:"margin:0"},"아직 넣은 문장이 없어요.")), navRow("골라 쓰기","완성하기"));
